<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fast Any Moves Ltd – Instant Moving Quote</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body{
font-family:'Poppins',sans-serif;
background:#f4f7fb;
margin:0;
}

.container{
max-width:800px;
margin:40px auto;
background:white;
padding:30px;
border-radius:12px;
box-shadow:0 8px 25px rgba(0,0,0,0.12);
}

h1{text-align:center;color:#0B4DBA;}
h2{text-align:center;font-weight:400;color:#555;margin-bottom:25px;}

label{font-weight:600;display:block;margin-top:15px;}

input,select,textarea{
width:100%;
padding:12px;
margin-top:5px;
border-radius:6px;
border:1px solid #ccc;
}

button{
width:100%;
padding:15px;
margin-top:8px;
border:none;
border-radius:6px;
font-weight:600;
cursor:pointer;
}

#quoteBtn{background:#0B4DBA;color:white;}
#whatsappBtn{background:#25D366;color:white;}
#emailBtn{background:#007bff;color:white;}

.result{
margin-top:25px;
padding:20px;
background:#eef5ff;
border-radius:8px;
white-space:pre-line;
}
</style>
</head>

<body>

<div class="container">

<h1>Fast Any Moves Ltd</h1>
<h2>Instant Moving Quote – London Man & Van</h2>

<form id="quoteForm">

<label>Name *</label>
<input type="text" id="name" required>

<label>Email *</label>
<input type="email" id="email" required>

<label>Phone *</label>
<input type="text" id="phone" required>

<label>Moving Date & Time *</label>
<input type="datetime-local" id="moveDate" required>

<label>Service *</label>
<select id="service" required>
<option value="">Select</option>
<option value="35">No help required + Medium Van</option>
<option value="40">1 Man + Medium Van</option>
<option value="70">2 Men + Medium Van</option>
<option value="100">3 Men + Medium Van</option>

<!-- 🔥 ADAUGATE -->
<option value="70_large">Large Van (£70/h)</option>
<option value="80_luton">Giant Luton Van (£80/h)</option>

</select>

<label>Collection Address *</label>
<input type="text" id="collection" required>

<label>Collection Stairs *</label>
<select id="stairsCollection" required>
<option value="0">Ground floor / Lift</option>
<option value="1">1 Flight</option>
<option value="2">2 Flights</option>
<option value="3">3 Flights</option>
<option value="4">4 Flights</option>
</select>

<label>Via Address (optional)</label>
<input type="text" id="via">

<label>Via Stairs</label>
<select id="stairsVia">
<option value="0">Ground floor / Lift</option>
<option value="1">1 Flight</option>
<option value="2">2 Flights</option>
<option value="3">3 Flights</option>
<option value="4">4 Flights</option>
</select>

<label>Delivery Address *</label>
<input type="text" id="delivery" required>

<label>Delivery Stairs *</label>
<select id="stairsDelivery" required>
<option value="0">Ground floor / Lift</option>
<option value="1">1 Flight</option>
<option value="2">2 Flights</option>
<option value="3">3 Flights</option>
<option value="4">4 Flights</option>
</select>

<label>Additional Information</label>
<textarea id="info"></textarea>

<button type="submit" id="quoteBtn">Get My Instant Quote</button>

</form>

<div id="result" class="result"></div>

<div id="bookingButtons" style="display:none;margin-top:10px;">
<button id="whatsappBtn">Book via WhatsApp</button>
<button id="emailBtn">Book via Email</button>
</div>

</div>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDex0iuSIdBsP21VWQJxws0dlpUj9heWac&libraries=places"></script>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>

emailjs.init("UTKviVTwg9BJjYixe");

document.getElementById("moveDate").min=new Date().toISOString().slice(0,16);

let quoteCalculated=false;
let fullMessage="";

function formatDate(dateValue){
let d=new Date(dateValue);
let day=String(d.getDate()).padStart(2,'0');
let month=String(d.getMonth()+1).padStart(2,'0');
let year=d.getFullYear();
let hours=String(d.getHours()).padStart(2,'0');
let minutes=String(d.getMinutes()).padStart(2,'0');
return `${day}/${month}/${year} - ${hours}:${minutes}`;
}

window.onload=function(){
new google.maps.places.Autocomplete(document.getElementById('collection'));
new google.maps.places.Autocomplete(document.getElementById('via'));
new google.maps.places.Autocomplete(document.getElementById('delivery'));
}

document.getElementById("quoteForm").addEventListener("submit",function(e){
e.preventDefault();
calculateQuote();
});

function calculateQuote(){

let serviceValue=document.getElementById("service").value;

// 🔥 LOGICA ORIGINALĂ + EXTINDERE
let rate=0;
let men=0;
let load=30*60;

if(serviceValue==="35"){rate=35;men=0;load=40*60;}
if(serviceValue==="40"){rate=40;men=1;load=30*60;}
if(serviceValue==="70"){rate=70;men=2;load=20*60;}
if(serviceValue==="100"){rate=100;men=3;load=15*60;}

// 🔥 ADAUGATE (FĂRĂ A STRICA NIMIC)
if(serviceValue==="70_large"){rate=70;men=1;load=30*60;}
if(serviceValue==="80_luton"){rate=80;men=1;load=40*60;}

let stairsTotal=parseInt(stairsCollection.value)+parseInt(stairsVia.value)+parseInt(stairsDelivery.value);
let costStairs=stairsTotal*10*men;

const collection=document.getElementById("collection").value;
const via=document.getElementById("via").value;
const delivery=document.getElementById("delivery").value;

const segments=via?
[{origin:collection,destination:via},{origin:via,destination:delivery}]
:[{origin:collection,destination:delivery}];

let totalMeters=0,totalSeconds=0,done=0;

segments.forEach(seg=>{
new google.maps.DistanceMatrixService().getDistanceMatrix({
origins:[seg.origin],
destinations:[seg.destination],
travelMode:"DRIVING"
},function(res){

let el=res.rows[0].elements[0];

totalMeters+=el.distance.value;
totalSeconds+=el.duration.value;

done++;

if(done===segments.length){
finish(totalMeters,totalSeconds);
}
});
});

function finish(meters,seconds){

let miles=meters/1609.34;
let costMiles=miles*1.5;

let stairsTime=stairsTotal*10*60;
let totalTime=seconds+load+stairsTime;

let hours=Math.ceil((totalTime/3600)*2)/2;
if(hours<2)hours=2;

let costHours=hours*rate;
let total=costHours+costMiles+costStairs;

let quote=`Estimated working time: ${hours}h
Distance: ${miles.toFixed(2)} miles

Cost hours: £${costHours.toFixed(2)}
Cost miles: £${costMiles.toFixed(2)}
Cost stairs: £${costStairs.toFixed(2)}

TOTAL: £${total.toFixed(2)}

This is an estimated quote.`;

document.getElementById("result").innerText=quote;
document.getElementById("bookingButtons").style.display="block";

fullMessage=quote;
quoteCalculated=true;
}
}

whatsappBtn.onclick=function(){
if(!quoteCalculated)return;
window.open("https://wa.me/447846769519?text="+encodeURIComponent(fullMessage));
}

emailBtn.onclick=function(){
if(!quoteCalculated)return;
emailjs.send("service_1e9jyk9","template_0tbv6y9",{quote:fullMessage})
.then(()=>alert("Email sent successfully"));
}

</script>

</body>
</html>
