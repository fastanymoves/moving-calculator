<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fast Any Moves Ltd – Instant Moving Quote</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body{font-family:'Poppins',sans-serif;background:#f4f7fb;margin:0;}
.container{max-width:800px;margin:40px auto;background:white;padding:30px;border-radius:12px;box-shadow:0 8px 25px rgba(0,0,0,0.12);}
h1{text-align:center;color:#0B4DBA;}
h2{text-align:center;color:#555;}
label{font-weight:600;margin-top:10px;display:block;}
input,select,textarea{width:100%;padding:12px;margin-top:5px;border-radius:6px;border:1px solid #ccc;}
button{width:100%;padding:15px;margin-top:10px;border:none;border-radius:6px;font-weight:600;cursor:pointer;}

#quoteBtn{background:#0B4DBA;color:white;}
#whatsappBtn{background:#25D366;color:white;}
#emailBtn{background:#007bff;color:white;}

.result{margin-top:20px;padding:20px;background:#eef5ff;border-radius:8px;white-space:pre-line;}
</style>
</head>

<body>

<div class="container">

<h1>Fast Any Moves Ltd</h1>
<h2>Instant Moving Quote – London Man & Van</h2>

<form id="quoteForm">

<input id="name" placeholder="Name" required>
<input id="email" type="email" placeholder="Email" required>
<input id="phone" placeholder="Phone" required>
<input id="moveDate" type="datetime-local" required>

<select id="van" required>
<option value="">Select Van</option>
<option value="small">Small Van</option>
<option value="medium">Medium Van</option>
<option value="large">Large Van</option>
<option value="luton">Luton Van</option>
</select>

<select id="help" required>
<option value="">Select Help</option>
<option value="0">Driver only</option>
<option value="1">Driver help</option>
<option value="2">Driver + 1 helper</option>
<option value="3">Driver + 2 helpers</option>
</select>

<input id="collection" placeholder="Collection Address" required>
<select id="stairsCollection">
<option value="0">Ground floor / Lift</option>
<option value="1">1 Flight</option>
<option value="2">2 Flights</option>
<option value="3">3 Flights</option>
<option value="4">4 Flights</option>
</select>

<input id="via" placeholder="Via Address (optional)">
<select id="stairsVia">
<option value="0">Ground floor / Lift</option>
<option value="1">1 Flight</option>
<option value="2">2 Flights</option>
<option value="3">3 Flights</option>
<option value="4">4 Flights</option>
</select>

<input id="delivery" placeholder="Delivery Address" required>
<select id="stairsDelivery">
<option value="0">Ground floor / Lift</option>
<option value="1">1 Flight</option>
<option value="2">2 Flights</option>
<option value="3">3 Flights</option>
<option value="4">4 Flights</option>
</select>

<textarea id="info" placeholder="Additional info"></textarea>

<button id="quoteBtn" type="submit">Get My Instant Quote</button>

</form>

<div id="result" class="result"></div>

<div id="bookingButtons" style="display:none;">
<button id="whatsappBtn" type="button">Book via WhatsApp</button>
<button id="emailBtn" type="button">Book via Email</button>
</div>

</div>

<script>
function initAutocomplete(){
new google.maps.places.Autocomplete(document.getElementById("collection"));
new google.maps.places.Autocomplete(document.getElementById("via"));
new google.maps.places.Autocomplete(document.getElementById("delivery"));
}
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDex0iuSIdBsP21VWQJxws0dlpUj9heWac&libraries=places&callback=initAutocomplete" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>

emailjs.init("UTKviVTwg9BJjYixe");

let quoteCalculated=false;
let fullMessage="";

document.getElementById("quoteForm").addEventListener("submit",function(e){
e.preventDefault();
calculateQuote();
});

function calculateQuote(){

let men=parseInt(document.getElementById("help").value);
let vanType=document.getElementById("van").value;

let rates={
small:[35,40,60,90],
medium:[35,40,60,90],
large:[40,50,70,100],
luton:[40,50,70,100]
};

let rate=rates[vanType][men];

let stairsTotal=
parseInt(document.getElementById("stairsCollection").value)+
parseInt(document.getElementById("stairsVia").value)+
parseInt(document.getElementById("stairsDelivery").value);

let costStairs=stairsTotal*10*men;

let collection=document.getElementById("collection").value;
let via=document.getElementById("via").value;
let delivery=document.getElementById("delivery").value;

const segments=via?
[{origin:collection,destination:via},{origin:via,destination:delivery}]
:[{origin:collection,destination:delivery}];

let totalMeters=0,totalSeconds=0,done=0;

segments.forEach(seg=>{
new google.maps.DistanceMatrixService().getDistanceMatrix({
origins:[seg.origin],
destinations:[seg.destination],
travelMode:"DRIVING"
},function(res){
let el=res.rows[0].elements[0];
totalMeters+=el.distance.value;
totalSeconds+=el.duration.value;
done++;
if(done===segments.length) finish(totalMeters,totalSeconds);
});
});

function finish(meters,seconds){

let miles=meters/1609.34;
let costMiles=miles*1.5;

let load=[40,30,20,15][men]*60;
let totalTime=seconds+load+(stairsTotal*600);

let hours=Math.ceil((totalTime/3600)*2)/2;
if(hours<2)hours=2;

let costHours=hours*rate;

let congestion=/(EC|WC|W1|SW1|SE1)/.test((collection+via+delivery).toUpperCase())?18:0;

let total=costHours+costMiles+costStairs+congestion;

let menText = men===0?"Driver only":men+" men";

let quote=`FAST ANY MOVES LTD

Estimated working time: ${hours} hours
Distance: ${miles.toFixed(2)} miles

--------------------------------

TOTAL PRICE: £${total.toFixed(2)}

--------------------------------

Labour
${hours} × £${rate} = £${costHours.toFixed(2)}

Distance
${miles.toFixed(2)} × £1.50 = £${costMiles.toFixed(2)}

Stairs
${menText} × ${stairsTotal} × £10 = £${costStairs.toFixed(2)}

Congestion
£${congestion.toFixed(2)}
`;

document.getElementById("result").innerText=quote;
document.getElementById("bookingButtons").style.display="block";

fullMessage=`Fast Any Moves Booking

Name: ${document.getElementById("name").value}
Phone: ${document.getElementById("phone").value}
Email: ${document.getElementById("email").value}

Collection: ${collection}
Via: ${via}
Delivery: ${delivery}

--------------------------------

${quote}`;

quoteCalculated=true;

}

}

/* EMAIL */
document.getElementById("emailBtn").onclick=function(){
if(!quoteCalculated)return alert("Calculate first");

emailjs.send("service_1e9jyk9","template_0tbv6y9",{
quote_breakdown: fullMessage,
email: document.getElementById("email").value
});
}

/* WHATSAPP */
document.getElementById("whatsappBtn").onclick=function(){
if(!quoteCalculated)return alert("Calculate first");
window.open("https://wa.me/447846769519?text="+encodeURIComponent(fullMessage));
}

</script>

</body>
</html>
