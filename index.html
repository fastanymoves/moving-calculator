<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fast Any Moves Ltd – Instant Moving Quote</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body{font-family:'Poppins',sans-serif;background:#f4f7fb;margin:0;}
.container{max-width:800px;margin:40px auto;background:white;padding:30px;border-radius:12px;box-shadow:0 8px 25px rgba(0,0,0,0.12);}
label{font-weight:600;display:block;margin-top:15px;}
input,select,textarea{width:100%;padding:12px;margin-top:5px;border-radius:6px;border:1px solid #ccc;}
button{width:100%;padding:15px;margin-top:8px;border:none;border-radius:6px;font-weight:600;cursor:pointer;}
#quoteBtn{background:#0B4DBA;color:white;}
#whatsappBtn{background:#25D366;color:white;}
#emailBtn{background:#007bff;color:white;}
.result{margin-top:25px;padding:20px;background:#eef5ff;border-radius:8px;white-space:pre-line;}
.error{color:red;font-size:13px;}
input.error,select.error{border:2px solid red;}
</style>
</head>

<body>

<div class="container">

<h2>Fast Any Moves Ltd – Instant Quote</h2>

<form id="form">

<label>Name *</label>
<input id="name">
<div class="error" id="err_name"></div>

<label>Email *</label>
<input id="email">
<div class="error" id="err_email"></div>

<label>Phone *</label>
<input id="phone">
<div class="error" id="err_phone"></div>

<label>Date *</label>
<input type="datetime-local" id="date">
<div class="error" id="err_date"></div>

<label>Van *</label>
<select id="van">
<option value="">Select</option>
<option value="small">Small</option>
<option value="medium">Medium</option>
<option value="large">Large</option>
<option value="luton">Luton</option>
</select>
<div class="error" id="err_van"></div>

<label>Help *</label>
<select id="help">
<option value="">Select</option>
<option value="0">Driver only</option>
<option value="1">1 man</option>
<option value="2">2 men</option>
<option value="3">3 men</option>
</select>
<div class="error" id="err_help"></div>

<label>Collection *</label>
<input id="collection">
<div class="error" id="err_collection"></div>

<label>Delivery *</label>
<input id="delivery">
<div class="error" id="err_delivery"></div>

<button id="quoteBtn">Get Quote</button>

</form>

<div id="result" class="result"></div>

<button id="whatsappBtn">WhatsApp</button>
<button id="emailBtn">Email</button>

</div>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDex0iuSIdBsP21VWQJxws0dlpUj9heWac&libraries=places"></script>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>

emailjs.init("UTKviVTwg9BJjYixe");

let ready=false;
let message="";

/* PRICING FIXED */
function getRate(van, men){
const pricing={
small:[35,40,60,90],
medium:[35,40,60,90],
large:[40,50,70,100],
luton:[40,50,70,100]
};
return pricing[van][men];
}

/* VALIDATION */
function validate(){

let ok=true;

function err(id,msg){
document.getElementById(id).innerText=msg;
ok=false;
}

function clear(id){
document.getElementById(id).innerText="";
}

["name","email","phone","date","van","help","collection","delivery"].forEach(f=>{
document.getElementById("err_"+f).innerText="";
document.getElementById(f).classList.remove("error");
});

if(!name.value){err("err_name","Required");name.classList.add("error");}
if(!email.value){err("err_email","Required");email.classList.add("error");}
if(!phone.value){err("err_phone","Required");phone.classList.add("error");}
if(!date.value || new Date(date.value)<=new Date()){err("err_date","Future date required");date.classList.add("error");}
if(!van.value){err("err_van","Required");van.classList.add("error");}
if(!help.value){err("err_help","Required");help.classList.add("error");}
if(!collection.value){err("err_collection","Required");collection.classList.add("error");}
if(!delivery.value){err("err_delivery","Required");delivery.classList.add("error");}

return ok;
}

/* SUBMIT */
form.onsubmit=function(e){
e.preventDefault();

if(!validate()) return;

let men=parseInt(help.value);
let rate=getRate(van.value,men);

let miles=10;
let hours=2;

let costHours=hours*rate;
let costMiles=miles*1.5;
let total=costHours+costMiles;

let quote=`TOTAL: £${total.toFixed(2)}

Labour: £${costHours.toFixed(2)}
Distance: £${costMiles.toFixed(2)}`;

result.innerText=quote;

message=`Name: ${name.value}
Phone: ${phone.value}

${quote}`;

ready=true;
};

/* EMAIL */
emailBtn.onclick=function(){
if(!ready){alert("Calculate first");return;}

emailjs.send("service_1e9jyk9","template_0tbv6y9",{
quote_breakdown: message,
email: email.value
})
.then(()=>alert("Email sent successfully ✔"))
.catch(()=>alert("Email failed ❌"));
};

/* WHATSAPP */
whatsappBtn.onclick=function(){
if(!ready){alert("Calculate first");return;}
window.open("https://wa.me/447846769519?text="+encodeURIComponent(message));
};

</script>

</body>
</html>
