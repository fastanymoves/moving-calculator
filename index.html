<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fast Any Moves Ltd – Instant Moving Quote</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body{font-family:'Poppins',sans-serif;background:#f4f7fb;margin:0;}
.container{max-width:800px;margin:40px auto;background:white;padding:30px;border-radius:12px;box-shadow:0 8px 25px rgba(0,0,0,0.12);}
h1{text-align:center;color:#0B4DBA;}
h2{text-align:center;font-weight:400;color:#555;margin-bottom:25px;}
label{font-weight:600;display:block;margin-top:15px;}
input,select,textarea{width:100%;padding:12px;margin-top:5px;border-radius:6px;border:1px solid #ccc;}
button{width:100%;padding:15px;margin-top:8px;border:none;border-radius:6px;font-weight:600;cursor:pointer;}
#quoteBtn{background:#0B4DBA;color:white;}
#whatsappBtn{background:#25D366;color:white;}
#emailBtn{background:#007bff;color:white;}
.result{margin-top:25px;padding:20px;background:#eef5ff;border-radius:8px;white-space:pre-line;}
.error{color:red;font-size:13px;margin-top:5px;}
</style>
</head>

<body>

<div class="container">

<h1>Fast Any Moves Ltd</h1>
<h2>Instant Moving Quote – London Man & Van</h2>

<form id="quoteForm">

<label>Name *</label>
<input type="text" id="name" required>

<label>Email *</label>
<input type="email" id="email" required>

<label>Phone *</label>
<input type="text" id="phone" required>

<label>Moving Date & Time *</label>
<input type="datetime-local" id="moveDate" required>
<div id="dateError" class="error"></div>

<label>Van *</label>
<select id="van" required>
<option value="">Select</option>
<option value="small">Small Van</option>
<option value="medium">Medium Van</option>
<option value="large">Large Van</option>
<option value="luton">Luton Van</option>
</select>

<label>Help *</label>
<select id="help" required>
<option value="">Select</option>
<option value="0">No help required</option>
<option value="1">Driver help</option>
<option value="2">Driver + 1 helper</option>
<option value="3">Driver + 2 helpers</option>
</select>

<label>Collection Address *</label>
<input type="text" id="collection" required>

<label>Collection Stairs *</label>
<select id="stairsCollection" required>
<option value="0">Ground floor / Lift</option>
<option value="1">1 Flight</option>
<option value="2">2 Flights</option>
<option value="3">3 Flights</option>
<option value="4">4 Flights</option>
</select>

<label>Via Address</label>
<input type="text" id="via">

<label>Via Stairs</label>
<select id="stairsVia">
<option value="0">Ground floor / Lift</option>
<option value="1">1 Flight</option>
<option value="2">2 Flights</option>
<option value="3">3 Flights</option>
<option value="4">4 Flights</option>
</select>

<label>Delivery Address *</label>
<input type="text" id="delivery" required>

<label>Delivery Stairs *</label>
<select id="stairsDelivery" required>
<option value="0">Ground floor / Lift</option>
<option value="1">1 Flight</option>
<option value="2">2 Flights</option>
<option value="3">3 Flights</option>
<option value="4">4 Flights</option>
</select>

<label>Additional Information</label>
<textarea id="info"></textarea>

<button type="submit" id="quoteBtn">Get My Instant Quote</button>

</form>

<div id="result" class="result"></div>

<div id="bookingButtons" style="display:none;margin-top:10px;">
<button id="whatsappBtn">Book via WhatsApp</button>
<button id="emailBtn">Book via Email</button>
</div>

</div>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDex0iuSIdBsP21VWQJxws0dlpUj9heWac"></script>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>

emailjs.init("UTKviVTwg9BJjYixe");

/* VALIDARE DATA */
quoteForm.addEventListener("submit",function(e){
e.preventDefault();

dateError.innerText="";
let selected=new Date(moveDate.value);
let now=new Date();

if(!moveDate.value){
dateError.innerText="Select date";
return;
}

if(selected<=now){
dateError.innerText="Date must be in future";
return;
}

calculate();
});

function calculate(){

let service=new google.maps.DistanceMatrixService();

let segments=via.value?
[
{origin:collection.value,destination:via.value},
{origin:via.value,destination:delivery.value}
]:
[
{origin:collection.value,destination:delivery.value}
];

let totalMeters=0,totalSeconds=0,done=0;

segments.forEach(seg=>{
service.getDistanceMatrix({
origins:[seg.origin],
destinations:[seg.destination],
travelMode:"DRIVING"
},function(res){

let el=res.rows[0].elements[0];

if(el.status!=="OK"){
alert("Invalid address");
return;
}

totalMeters+=el.distance.value;
totalSeconds+=el.duration.value;
done++;

if(done===segments.length) finish(totalMeters,totalSeconds);
});
});

function finish(meters,seconds){

let miles=meters/1609.34;
let travelHours=seconds/3600;

let men=parseInt(help.value);
let rate=[45,50,100,120][men];

let stairsTotal=parseInt(stairsCollection.value)+parseInt(stairsVia.value)+parseInt(stairsDelivery.value);
let costStairs=stairsTotal*10*men;

let load=[40,30,20,15][men]/60;
let hours=Math.ceil((travelHours+load+stairsTotal*0.166)*2)/2;
if(hours<2)hours=2;

let costHours=hours*rate;
let costMiles=miles*1.5;

let total=costHours+costMiles+costStairs;

let menText=men===0?"Driver only":men===1?"1 man":men+" men";

let quote=`FAST ANY MOVES LTD

Estimated working time: ${hours}h
Distance: ${miles.toFixed(2)} miles

--------------------------------

TOTAL: £${total.toFixed(2)}

--------------------------------

Breakdown:

Labour
${hours}h × £${rate} = £${costHours.toFixed(2)}

Distance
${miles.toFixed(2)} × £1.50 = £${costMiles.toFixed(2)}

Stairs
${stairsTotal} flights × £10 × ${menText} = £${costStairs.toFixed(2)}

--------------------------------

This quotation is based on the details provided by the customer.

Any additional time will be charged in 30-minute increments.`;

result.innerText=quote;
bookingButtons.style.display="block";

fullMessage=`Fast Any Moves Booking

Name: ${name.value}
Phone: ${phone.value}
Email: ${email.value}

Move Date: ${new Date(moveDate.value).toLocaleString('en-GB')}

Van: ${van.value}
Help: ${menText}

Collection: ${collection.value}
Collection Stairs: ${stairsCollection.options[stairsCollection.selectedIndex].text}

Via: ${via.value}
Via Stairs: ${stairsVia.options[stairsVia.selectedIndex].text}

Delivery: ${delivery.value}
Delivery Stairs: ${stairsDelivery.options[stairsDelivery.selectedIndex].text}

${quote}`;
}
}

/* EMAIL */
emailBtn.onclick=function(){
emailjs.send("service_1e9jyk9","template_0tbv6y9",{
quote_breakdown: fullMessage,
email: email.value
});
}

/* WHATSAPP */
whatsappBtn.onclick=function(){
window.open("https://wa.me/447846769519?text="+encodeURIComponent(fullMessage));
}

</script>

</body>
</html>
