<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fast Any Moves Ltd – Instant Moving Quote</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body{font-family:'Poppins',sans-serif;background:#f4f7fb;margin:0;}
.container{max-width:800px;margin:40px auto;background:white;padding:30px;border-radius:12px;box-shadow:0 8px 25px rgba(0,0,0,0.12);}
h1{text-align:center;color:#0B4DBA;}
h2{text-align:center;font-weight:400;color:#555;margin-bottom:25px;}
label{font-weight:600;display:block;margin-top:15px;}
input,select,textarea{width:100%;padding:12px;margin-top:5px;border-radius:6px;border:1px solid #ccc;}
button{width:100%;padding:15px;margin-top:10px;border:none;border-radius:6px;font-weight:600;cursor:pointer;}

#quoteBtn{
background:#0B4DBA;
color:white;
}

#whatsappBtn{background:#25D366;color:white;}
#emailBtn{background:#007bff;color:white;}

.result{margin-top:25px;padding:20px;background:#eef5ff;border-radius:8px;white-space:pre-line;}
</style>
</head>

<body>

<div class="container">

<h1>Fast Any Moves Ltd</h1>
<h2>Instant Moving Quote – London Man & Van</h2>

<form id="quoteForm">

<input type="text" id="name" placeholder="Name" required>
<input type="email" id="email" placeholder="Email" required>
<input type="text" id="phone" placeholder="Phone" required>
<input type="datetime-local" id="moveDate" required>

<select id="van" required>
<option value="">Select Van</option>
<option value="small">Small Van</option>
<option value="medium">Medium Van</option>
<option value="large">Large Van</option>
<option value="luton">Luton Van</option>
</select>

<select id="help" required>
<option value="">Select Help</option>
<option value="0">No help</option>
<option value="1">Driver help</option>
<option value="2">Driver + 1 helper</option>
<option value="3">Driver + 2 helpers</option>
</select>

<input type="text" id="collection" placeholder="Collection Address" required>
<select id="stairsCollection"><option value="0">Collection Stairs</option><option value="1">1</option><option value="2">2</option></select>

<input type="text" id="delivery" placeholder="Delivery Address" required>
<select id="stairsDelivery"><option value="0">Delivery Stairs</option><option value="1">1</option><option value="2">2</option></select>

<textarea id="info" placeholder="Additional info"></textarea>

<button type="submit" id="quoteBtn">Get My Instant Quote</button>

</form>

<div id="result" class="result"></div>

<div id="bookingButtons" style="display:none;">
<button type="button" id="whatsappBtn">Book via WhatsApp</button>
<button type="button" id="emailBtn">Book via Email</button>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>

emailjs.init("UTKviVTwg9BJjYixe");

let quoteCalculated=false;
let fullMessage="";

quoteForm.addEventListener("submit",function(e){
e.preventDefault();
calculateQuote();
});

function calculateQuote(){

let men=parseInt(help.value);

let rates={
small:[35,40,60,90],
medium:[35,40,60,90],
large:[40,50,70,100],
luton:[40,50,70,100]
};

let rate=rates[van.value][men];

let stairsTotal=parseInt(stairsCollection.value)+parseInt(stairsDelivery.value);
let costStairs=stairsTotal*10*men;

let miles=10;
let costMiles=miles*1.5;

let hours=2;
let costHours=hours*rate;

let congestion=0;

let total=costHours+costMiles+costStairs+congestion;

let menText = men===0?"Driver only":(men===1?"1 man":men+" men");

let quote=`FAST ANY MOVES LTD

Quote Reference: FAM-${Math.floor(10000+Math.random()*90000)}

--------------------------------

TOTAL PRICE: £${total.toFixed(2)}

--------------------------------

COST BREAKDOWN

Labour
${hours} hours × £${rate}/hour
= £${costHours.toFixed(2)}

Distance
${miles} miles × £1.50
= £${costMiles.toFixed(2)}

Stairs
${menText} × ${stairsTotal} flights × £10
= £${costStairs.toFixed(2)}
`;

result.innerText=quote;
bookingButtons.style.display="block";

fullMessage=`CLIENT DETAILS

Name: ${name.value}
Phone: ${phone.value}
Email: ${email.value}

Collection: ${collection.value}
Delivery: ${delivery.value}

--------------------------------

${quote}`;

quoteCalculated=true;

}

/* EMAIL */
emailBtn.onclick=function(){
if(!quoteCalculated)return alert("Calculate quote first");

emailjs.send("service_1e9jyk9","template_0tbv6y9",{
quote_breakdown: fullMessage,
email: email.value
})
.then(()=>alert("Email sent successfully"))
.catch(()=>alert("Email failed"));
}

/* WHATSAPP */
whatsappBtn.onclick=function(){
if(!quoteCalculated)return alert("Calculate quote first");
window.open("https://wa.me/447846769519?text="+encodeURIComponent(fullMessage));
}

</script>

</body>
</html>
