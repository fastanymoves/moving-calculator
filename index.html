<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fast Any Moves Ltd – FULL PRO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body{font-family:'Poppins',sans-serif;background:#f4f7fb;margin:0;}
.container{max-width:800px;margin:40px auto;background:white;padding:30px;border-radius:12px;box-shadow:0 8px 25px rgba(0,0,0,0.12);}
label{font-weight:600;display:block;margin-top:15px;}
input,select,textarea{width:100%;padding:12px;margin-top:5px;border-radius:6px;border:1px solid #ccc;}
button{width:100%;padding:15px;margin-top:10px;border:none;border-radius:6px;cursor:pointer;font-weight:600;}
#quoteBtn{background:#0B4DBA;color:white;}
#whatsappBtn{background:#25D366;color:white;}
#emailBtn{background:#007bff;color:white;}
.error{color:red;font-size:13px;}
.result{margin-top:20px;background:#eef5ff;padding:15px;border-radius:8px;white-space:pre-line;}
</style>
</head>

<body>

<div class="container">

<h2>Fast Any Moves Ltd – FULL PRO Quote</h2>

<form id="form">

<input id="name" placeholder="Name">
<div id="err_name" class="error"></div>

<input id="email" placeholder="Email">
<div id="err_email" class="error"></div>

<input id="phone" placeholder="Phone">
<div id="err_phone" class="error"></div>

<input type="datetime-local" id="date">
<div id="err_date" class="error"></div>

<select id="van">
<option value="">Select Van</option>
<option value="small">Small</option>
<option value="medium">Medium</option>
<option value="large">Large</option>
<option value="luton">Luton</option>
</select>

<select id="help">
<option value="">Select Help</option>
<option value="0">Driver only</option>
<option value="1">1 man</option>
<option value="2">2 men</option>
<option value="3">3 men</option>
</select>

<input id="collection" placeholder="Collection address">
<div id="err_collection" class="error"></div>

<select id="stairsCollection">
<option value="0">Ground / Lift</option>
<option value="1">1 Flight</option>
<option value="2">2 Flights</option>
<option value="3">3 Flights</option>
<option value="4">4 Flights</option>
</select>

<input id="delivery" placeholder="Delivery address">
<div id="err_delivery" class="error"></div>

<select id="stairsDelivery">
<option value="0">Ground / Lift</option>
<option value="1">1 Flight</option>
<option value="2">2 Flights</option>
<option value="3">3 Flights</option>
<option value="4">4 Flights</option>
</select>

<textarea id="info" placeholder="Additional info"></textarea>

<button id="quoteBtn">Get Quote</button>

</form>

<div id="result" class="result"></div>

<button id="whatsappBtn">WhatsApp</button>
<button id="emailBtn">Email</button>

</div>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDex0iuSIdBsP21VWQJxws0dlpUj9heWac"></script>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>

emailjs.init("UTKviVTwg9BJjYixe");

/* ===== VALIDARE ===== */
function validate(){
let ok=true;

function err(id,msg){
document.getElementById("err_"+id).innerText=msg;
if(msg) ok=false;
}

err("name",""); err("email",""); err("phone",""); err("date",""); err("collection",""); err("delivery","");

let name=nameInput.value.trim();
let email=emailInput.value.trim();
let phone=phoneInput.value.trim();
let date=dateInput.value;

if(name.length<2) err("name","Enter name");
if(!email.includes("@")) err("email","Invalid email");
if(phone.length<8) err("phone","Invalid phone");

if(!date || new Date(date)<=new Date()) err("date","Future date required");

if(!collection.value) err("collection","Required");
if(!delivery.value) err("delivery","Required");

return ok;
}

/* ===== PRICING ===== */
function getRate(van,men){
const table={
small:[45,65,85,105],
medium:[55,75,95,115],
large:[65,85,100,120],
luton:[75,95,110,130]
};
return table[van][men];
}

/* ===== MAIN ===== */
let fullMessage="",ready=false;

form.addEventListener("submit",function(e){
e.preventDefault();
if(!validate()) return;

let service=new google.maps.DistanceMatrixService();

service.getDistanceMatrix({
origins:[collection.value],
destinations:[delivery.value],
travelMode:"DRIVING"
},function(res,status){

if(status!=="OK") return alert("Address error");

let el=res.rows[0].elements[0];
if(el.status!=="OK") return alert("Route error");

let miles=el.distance.value/1609.34;
let baseHours=el.duration.value/3600;

/* TIME + BUFFER */
let hours=Math.ceil((baseHours+1)*2)/2;
if(hours<2) hours=2;

/* PRICING */
let men=parseInt(help.value);
let rate=getRate(van.value,men);

/* RUSH HOUR */
let h=new Date(date.value).getHours();
if(h>=8 && h<=10 || h>=16 && h<=18){
rate+=10;
}

/* STAIRS */
let stairsTotal=parseInt(stairsCollection.value)+parseInt(stairsDelivery.value);
let costStairs=stairsTotal*10*men;

/* CONGESTION */
let congestion=/(EC|WC|W1|SW1|SE1)/.test((collection.value+delivery.value).toUpperCase())?18:0;

let total=hours*rate + miles*1.5 + costStairs + congestion;

let quote=`TOTAL: £${total.toFixed(2)}

Distance: ${miles.toFixed(2)} miles
Time: ${hours}h
Rate: £${rate}/h
Congestion: £${congestion}`;

/* OUTPUT */
result.innerText=quote;

/* MESSAGE */
fullMessage=`Fast Any Moves Booking

Name: ${name.value}
Phone: ${phone.value}
Email: ${email.value}

Date: ${new Date(date.value).toLocaleString('en-GB')}

Van: ${van.value}
Men: ${men}

Collection: ${collection.value}
Stairs: ${stairsCollection.options[stairsCollection.selectedIndex].text}

Delivery: ${delivery.value}
Stairs: ${stairsDelivery.options[stairsDelivery.selectedIndex].text}

${quote}`;

ready=true;

});
});

/* EMAIL */
emailBtn.onclick=function(){
if(!ready)return;
emailjs.send("service_1e9jyk9","template_0tbv6y9",{quote_breakdown:fullMessage,email:email.value});
}

/* WHATSAPP */
whatsappBtn.onclick=function(){
window.open("https://wa.me/447846769519?text="+encodeURIComponent(fullMessage));
}

</script>

</body>
</html>
