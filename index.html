<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fast Any Moves Ltd – Instant Quote</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body{font-family:Poppins;background:#f4f7fb;margin:0;}
.container{max-width:800px;margin:40px auto;background:white;padding:25px;border-radius:12px;box-shadow:0 8px 25px rgba(0,0,0,.1);}
h1{text-align:center;color:#0B4DBA;}
label{display:block;margin-top:12px;font-weight:600;}
input,select,textarea{width:100%;padding:12px;margin-top:5px;border-radius:6px;border:1px solid #ccc;}
button{width:100%;padding:15px;margin-top:10px;border:none;border-radius:6px;font-weight:600;cursor:pointer;}
#quoteBtn{background:#0B4DBA;color:#fff;}
#whatsappBtn{background:#25D366;color:#fff;}
#emailBtn{background:#007bff;color:#fff;}
.result{margin-top:20px;padding:20px;background:#eef5ff;border-radius:8px;}
.loading{text-align:center;color:#555;}
.error{color:red;text-align:center;}
</style>
</head>

<body>

<div class="container">
<h1>Fast Any Moves Ltd</h1>

<form id="form">

<label>Name*</label>
<input id="name" required>

<label>Email*</label>
<input id="email" type="email" required>

<label>Phone*</label>
<input id="phone" required>

<label>Move Date*</label>
<input type="datetime-local" id="date" required>

<label>Van*</label>
<select id="van" required>
<option value="">Select</option>
<option value="small">Small Van</option>
<option value="medium">Medium Van</option>
<option value="large">Large Van</option>
<option value="luton">Luton Van</option>
</select>

<label>Help*</label>
<select id="help" required>
<option value="">Select</option>
<option value="0">No help</option>
<option value="1">Driver help</option>
<option value="2">Driver +1 helper</option>
<option value="3">Driver +2 helpers</option>
</select>

<label>Collection Address*</label>
<input id="collection" required>

<label>Via Address (optional)</label>
<input id="via">

<label>Delivery Address*</label>
<input id="delivery" required>

<button id="quoteBtn">Get Instant Quote</button>

</form>

<div id="result" class="result"></div>

<button id="whatsappBtn" style="display:none;">Book via WhatsApp</button>
<button id="emailBtn" style="display:none;">Send via Email</button>

</div>

<!-- ✅ GOOGLE API (CHEIA TA) -->
<script defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDex0iuSIdBsP21VWQJxws0dlpUj9heWac&libraries=places"></script>

<!-- ✅ EMAILJS -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>
emailjs.init("UTKviVTwg9BJjYixe");

/* MIN DATE */
let now=new Date();
now.setMinutes(now.getMinutes()-now.getTimezoneOffset());
date.min=now.toISOString().slice(0,16);

/* AUTOCOMPLETE */
window.onload=()=>{
 new google.maps.places.Autocomplete(collection);
 new google.maps.places.Autocomplete(via);
 new google.maps.places.Autocomplete(delivery);
};

/* DISTANCE */
function getDistance(origin,destination){
 return new Promise((resolve,reject)=>{
  new google.maps.DistanceMatrixService().getDistanceMatrix({
   origins:[origin],
   destinations:[destination],
   travelMode:"DRIVING"
  },(res,status)=>{
   if(status!=="OK") return reject(status);

   let el=res.rows[0].elements[0];
   if(el.status!=="OK") return reject("No route");

   resolve({
    distance:el.distance.value,
    duration:el.duration.value
   });
  });
 });
}

/* RATE */
function getRate(van,men){
 return {
  small:[35,40,60,90],
  medium:[35,40,60,90],
  large:[40,50,70,100],
  luton:[40,50,70,100]
 }[van][men];
}

/* FORM */
form.onsubmit = async e=>{
 e.preventDefault();

 if(!/^\+?44\d{9,10}$/.test(phone.value)){
  alert("Enter valid UK phone number");
  return;
 }

 result.innerHTML="<div class='loading'>Calculating your quote...</div>";
 quoteBtn.disabled=true;

 let men=parseInt(help.value);
 let rate=getRate(van.value,men);

 let totalDistance=0;
 let totalDuration=0;

 try{

 if(via.value.trim()){
  let a=await getDistance(collection.value,via.value);
  let b=await getDistance(via.value,delivery.value);
  totalDistance=a.distance+b.distance;
  totalDuration=a.duration+b.duration;
 }else{
  let trip=await getDistance(collection.value,delivery.value);
  totalDistance=trip.distance;
  totalDuration=trip.duration;
 }

 let miles=totalDistance/1609.34;
 let hours=Math.ceil((totalDuration/3600)*2)/2;
 if(hours<2) hours=2;

 let costHours=hours*rate;
 let costMiles=miles*1.5;

 let congestion=/(EC|WC|W1|SW1|SE1)/.test((collection.value+via.value+delivery.value).toUpperCase())?18:0;

 let total=costHours+costMiles+congestion;
 if(total<60) total=60;

 let quote=`TOTAL: £${total.toFixed(2)}
Time: ${hours} hours
Distance: ${miles.toFixed(2)} miles`;

 result.innerHTML="<b>"+quote+"</b>";

 window.fullMessage = `
Fast Any Moves Booking

Name: ${name.value}
Phone: ${phone.value}
Email: ${email.value}

${quote}
`;

 whatsappBtn.style.display="block";
 emailBtn.style.display="block";

 }catch(err){
  result.innerHTML="<div class='error'>Could not calculate route. Check addresses.</div>";
 }

 quoteBtn.disabled=false;
};

/* EMAIL */
emailBtn.onclick=()=>{
 emailjs.send("service_1e9jyk9","template_0tbv6y9",{
  quote_breakdown: fullMessage,
  email: email.value
 }).then(()=>alert("Email sent ✔"));
};

/* WHATSAPP */
whatsappBtn.onclick=()=>{
 window.open("https://wa.me/447846769519?text="+encodeURIComponent(fullMessage));
};
</script>

</body>
</html>
