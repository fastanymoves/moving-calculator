<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fast Any Moves Ltd – PRO Quote</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:sans-serif;background:#f4f7fb;}
.container{max-width:800px;margin:30px auto;background:#fff;padding:25px;border-radius:10px;}
input,select,textarea{width:100%;padding:10px;margin-top:5px;}
button{margin-top:10px;padding:12px;width:100%;cursor:pointer;}
.error{color:red;font-size:13px;}
.result{margin-top:20px;background:#eef5ff;padding:15px;}
</style>
</head>

<body>

<div class="container">

<h2>Fast Any Moves – PRO Quote</h2>

<form id="form">

<input id="name" placeholder="Name">
<div id="err_name" class="error"></div>

<input id="email" placeholder="Email">
<div id="err_email" class="error"></div>

<input id="phone" placeholder="Phone">
<div id="err_phone" class="error"></div>

<input type="datetime-local" id="date">
<div id="err_date" class="error"></div>

<select id="help">
<option value="">Help</option>
<option value="0">Driver only</option>
<option value="1">Driver help</option>
<option value="2">Driver + 1 helper</option>
<option value="3">Driver + 2 helpers</option>
</select>

<input id="collection" placeholder="Collection address">
<div id="err_collection" class="error"></div>

<select id="stairsCollection">
<option value="0">Ground floor / Lift</option>
<option value="1">1 Flight</option>
<option value="2">2 Flights</option>
<option value="3">3 Flights</option>
<option value="4">4 Flights</option>
</select>

<input id="delivery" placeholder="Delivery address">
<div id="err_delivery" class="error"></div>

<select id="stairsDelivery">
<option value="0">Ground floor / Lift</option>
<option value="1">1 Flight</option>
<option value="2">2 Flights</option>
<option value="3">3 Flights</option>
<option value="4">4 Flights</option>
</select>

<textarea id="info" placeholder="Additional info"></textarea>

<button type="submit">Get Quote</button>

</form>

<div id="result" class="result"></div>

<button id="whatsappBtn">WhatsApp</button>
<button id="emailBtn">Email</button>

</div>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDex0iuSIdBsP21VWQJxws0dlpUj9heWac&libraries=places"></script>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>

emailjs.init("UTKviVTwg9BJjYixe");

/* ===== VALIDARE ===== */
function validate(){
let ok=true;

function err(id,msg){
document.getElementById("err_"+id).innerText=msg;
if(msg) ok=false;
}

err("name",""); err("email",""); err("phone",""); err("date","");
err("collection",""); err("delivery","");

let name=document.getElementById("name").value.trim();
let email=document.getElementById("email").value.trim();
let phone=document.getElementById("phone").value.trim();
let date=document.getElementById("date").value;
let collection=document.getElementById("collection").value.trim();
let delivery=document.getElementById("delivery").value.trim();

if(name.length<2) err("name","Enter name");
if(!email.includes("@")) err("email","Invalid email");
if(phone.length<8) err("phone","Invalid phone");

let now=new Date();
if(!date || new Date(date)<=now) err("date","Future date required");

if(!collection) err("collection","Required");
if(!delivery) err("delivery","Required");

return ok;
}

/* ===== FORMAT DATE ===== */
function formatDateUK(val){
return new Date(val).toLocaleString('en-GB',{
day:'numeric',month:'short',year:'numeric',
hour:'2-digit',minute:'2-digit'
});
}

let fullMessage="";
let quoteReady=false;

/* ===== SUBMIT ===== */
document.getElementById("form").addEventListener("submit",function(e){
e.preventDefault();
if(!validate()) return;
calculate();
});

/* ===== GOOGLE DISTANCE ===== */
function calculate(){

let service=new google.maps.DistanceMatrixService();

let collection=document.getElementById("collection").value;
let delivery=document.getElementById("delivery").value;

service.getDistanceMatrix({
origins:[collection],
destinations:[delivery],
travelMode:"DRIVING"
},function(res,status){

if(status!=="OK"){
alert("Address error");
return;
}

let el=res.rows[0].elements[0];

if(el.status!=="OK"){
alert("Invalid route");
return;
}

/* ===== DISTANCE REAL ===== */
let meters=el.distance.value;
let seconds=el.duration.value;

let miles=meters/1609.34;
let hoursTravel=seconds/3600;

/* ===== CALCUL ===== */
let help=parseInt(document.getElementById("help").value);
let rate=[45,50,100,120][help];

let stairsTotal=
parseInt(stairsCollection.value)+
parseInt(stairsDelivery.value);

let costStairs=stairsTotal*10*help;

let hours=Math.ceil((hoursTravel+1)*2)/2;
if(hours<2) hours=2;

let cost=hours*rate + miles*1.5 + costStairs;

let menText=help===0?"Driver only":help===1?"1 man":help+" men";

let quote=`TOTAL: £${cost.toFixed(2)}

Distance: ${miles.toFixed(2)} miles
Time: ${hours} hours`;

document.getElementById("result").innerText=quote;

/* ===== MESSAGE ===== */
fullMessage=`Fast Any Moves Booking

Name: ${document.getElementById("name").value}
Phone: ${document.getElementById("phone").value}
Email: ${document.getElementById("email").value}

Move Date: ${formatDateUK(document.getElementById("date").value)}

Help: ${menText}

Collection: ${collection}
Collection Stairs: ${stairsCollection.options[stairsCollection.selectedIndex].text}

Delivery: ${delivery}
Delivery Stairs: ${stairsDelivery.options[stairsDelivery.selectedIndex].text}

${quote}`;

quoteReady=true;

});

}

/* ===== EMAIL ===== */
emailBtn.onclick=function(){
if(!quoteReady)return alert("Generate quote first");

emailjs.send("service_1e9jyk9","template_0tbv6y9",{
quote_breakdown: fullMessage,
email: document.getElementById("email").value
}).then(()=>alert("Email sent"));
}

/* ===== WHATSAPP ===== */
whatsappBtn.onclick=function(){
if(!quoteReady)return;
window.open("https://wa.me/447846769519?text="+encodeURIComponent(fullMessage));
}

</script>

</body>
</html>
