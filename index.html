<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fast Any Moves Ltd – Instant Moving Quote</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body{font-family:'Poppins',sans-serif;background:#f4f7fb;margin:0;}
.container{max-width:800px;margin:40px auto;background:white;padding:30px;border-radius:12px;box-shadow:0 8px 25px rgba(0,0,0,0.12);}
h1{text-align:center;color:#0B4DBA;}
h2{text-align:center;font-weight:400;color:#555;margin-bottom:25px;}
label{font-weight:600;display:block;margin-top:15px;}
input,select,textarea{width:100%;padding:12px;margin-top:5px;border-radius:6px;border:1px solid #ccc;}
button{width:100%;padding:15px;margin-top:8px;border:none;border-radius:6px;font-weight:600;cursor:pointer;}
#quoteBtn{background:#0B4DBA;color:white;}
#whatsappBtn{background:#25D366;color:white;}
#emailBtn{background:#007bff;color:white;}
.result{margin-top:25px;padding:20px;background:#eef5ff;border-radius:8px;white-space:pre-line;}
</style>
</head>

<body>

<div class="container">

<h1>Fast Any Moves Ltd</h1>
<h2>Instant Moving Quote – London Man & Van</h2>

<form id="quoteForm">

<label>Name *</label>
<input type="text" id="name" required>

<label>Email *</label>
<input type="email" id="email" required>

<label>Phone *</label>
<input type="text" id="phone" required>

<label>Moving Date & Time *</label>
<input type="datetime-local" id="moveDate" required>

<label>What size of van do you need for?</label>
<select id="van" required>
<option value="">Select</option>
<option value="medium">Small & Medium Van</option>
<option value="large">Large Van</option>
<option value="luton">Giant Luton Van</option>
</select>

<label>Do you need help with loading and unloading?</label>
<select id="help" required>
<option value="">Select</option>
<option value="0">No help required</option>
<option value="1">Driver help</option>
<option value="2">Driver help + 1 helper</option>
<option value="3">Driver help + 2 helpers</option>
</select>

<label>Collection Address *</label>
<input type="text" id="collection" required>

<label>Collection Stairs *</label>
<select id="stairsCollection" required>
<option value="0">Ground floor / Lift</option>
<option value="1">1 Flight</option>
<option value="2">2 Flights</option>
<option value="3">3 Flights</option>
<option value="4">4 Flights</option>
</select>

<label>Via Address</label>
<input type="text" id="via">

<label>Via Stairs</label>
<select id="stairsVia">
<option value="0">Ground floor / Lift</option>
<option value="1">1 Flight</option>
<option value="2">2 Flights</option>
<option value="3">3 Flights</option>
<option value="4">4 Flights</option>
</select>

<label>Delivery Address *</label>
<input type="text" id="delivery" required>

<label>Delivery Stairs *</label>
<select id="stairsDelivery" required>
<option value="0">Ground floor / Lift</option>
<option value="1">1 Flight</option>
<option value="2">2 Flights</option>
<option value="3">3 Flights</option>
<option value="4">4 Flights</option>
</select>

<label>Additional Information</label>
<textarea id="info"></textarea>

<button type="submit" id="quoteBtn">Get My Instant Quote</button>

</form>

<div id="result" class="result"></div>

<div id="bookingButtons" style="display:none;">
<button id="whatsappBtn">Book via WhatsApp</button>
<button id="emailBtn">Book via Email</button>
</div>

</div>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDex0iuSIdBsP21VWQJxws0dlpUj9heWac&libraries=places"></script>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>

emailjs.init("UTKviVTwg9BJjYixe");

let quoteCalculated=false;
let fullMessage="";

function formatDate(dateValue){
let d=new Date(dateValue);
let day=String(d.getDate()).padStart(2,'0');
let month=String(d.getMonth()+1).padStart(2,'0');
let hours=String(d.getHours()).padStart(2,'0');
let minutes=String(d.getMinutes()).padStart(2,'0');
return `${day}/${month}/${d.getFullYear()} - ${hours}:${minutes}`;
}

window.onload=function(){
new google.maps.places.Autocomplete(collection);
new google.maps.places.Autocomplete(via);
new google.maps.places.Autocomplete(delivery);
}

document.getElementById("quoteForm").addEventListener("submit",function(e){
e.preventDefault();
calculateQuote();
});

function calculateQuote(){

let name=document.getElementById("name").value;
let phone=document.getElementById("phone").value;
let email=document.getElementById("email").value;

let van=document.getElementById("van").value;
let men=parseInt(document.getElementById("help").value);

let rate=0;
if(men===0) rate=45;
if(men===1) rate=50;
if(men===2) rate=100;
if(men===3) rate=120;

let stairsTotal=parseInt(stairsCollection.value)+parseInt(stairsVia.value)+parseInt(stairsDelivery.value);
let costStairs=stairsTotal*10*men;

const collection=document.getElementById("collection").value;
const via=document.getElementById("via").value;
const delivery=document.getElementById("delivery").value;

new google.maps.DistanceMatrixService().getDistanceMatrix({
origins:[collection],
destinations:[delivery],
travelMode:"DRIVING"
},function(res){

let el=res.rows[0].elements[0];

let miles=el.distance.value/1609.34;
let seconds=el.duration.value;

let load=30*60;
if(men===0) load=40*60;
if(men===1) load=30*60;
if(men===2) load=20*60;
if(men===3) load=15*60;

let totalTime=seconds+load+(stairsTotal*600);

let hours=Math.ceil((totalTime/3600)*2)/2;
if(hours<2)hours=2;

let costHours=hours*rate;

let total=costHours+(miles*1.5)+costStairs;

let formattedDate=formatDate(document.getElementById("moveDate").value);

let quote=`TOTAL: £${total.toFixed(2)}`;

document.getElementById("result").innerText=quote;
document.getElementById("bookingButtons").style.display="block";

fullMessage=`Fast Any Moves Booking

Name: ${name}
Phone: ${phone}
Email: ${email}
Move Date: ${formattedDate}
Van: ${van}
Help: ${men}
Collection: ${collection}
Delivery: ${delivery}

${quote}`;

quoteCalculated=true;

// 🔥 EMAIL FIX
document.getElementById("emailBtn").onclick=function(){
emailjs.send("service_1e9jyk9","template_0tbv6y9",{
name:name,
phone:phone,
email:email,
move_date:formattedDate,
service:`${van} / ${men}`,
collection:collection,
delivery:delivery,
quote_breakdown:fullMessage
}).then(()=>alert("Email sent"));
}

});

}

</script>

</body>
</html>
