<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fast Any Moves Ltd – Instant Moving Quote</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body{font-family:'Poppins',sans-serif;background:#f4f7fb;margin:0;}
.container{max-width:800px;margin:40px auto;background:white;padding:30px;border-radius:12px;box-shadow:0 8px 25px rgba(0,0,0,0.12);}
h1{text-align:center;color:#0B4DBA;}
h2{text-align:center;font-weight:400;color:#555;margin-bottom:25px;}
label{font-weight:600;display:block;margin-top:15px;}
input,select,textarea{width:100%;padding:12px;margin-top:5px;border-radius:6px;border:1px solid #ccc;}
button{width:100%;padding:15px;margin-top:8px;border:none;border-radius:6px;font-weight:600;cursor:pointer;}
#quoteBtn{background:#0B4DBA;color:white;}
#whatsappBtn{background:#25D366;color:white;}
#emailBtn{background:#007bff;color:white;}
.result{margin-top:25px;padding:20px;background:#eef5ff;border-radius:8px;white-space:pre-line;}
.error{color:red;font-size:13px;margin-top:5px;}
</style>
</head>

<body>

<div class="container">

<h1>Fast Any Moves Ltd</h1>
<h2>Instant Moving Quote – London Man & Van</h2>

<form id="quoteForm">

<input type="text" id="name" placeholder="Name" required>
<input type="email" id="email" placeholder="Email" required>
<input type="text" id="phone" placeholder="Phone" required>

<input type="datetime-local" id="moveDate" required>
<div id="dateError" class="error"></div>

<select id="van" required>
<option value="">Select Van</option>
<option value="small">Small</option>
<option value="medium">Medium</option>
<option value="large">Large</option>
<option value="luton">Luton</option>
</select>

<select id="help" required>
<option value="">Help</option>
<option value="0">Driver only</option>
<option value="1">1 man</option>
<option value="2">2 men</option>
<option value="3">3 men</option>
</select>

<input id="collection" placeholder="Collection address" required>
<input id="via" placeholder="Via address">
<input id="delivery" placeholder="Delivery address" required>

<select id="stairsCollection">
<option value="0">Ground</option><option value="1">1</option><option value="2">2</option>
<option value="3">3</option><option value="4">4</option>
</select>

<select id="stairsVia">
<option value="0">Ground</option><option value="1">1</option><option value="2">2</option>
<option value="3">3</option><option value="4">4</option>
</select>

<select id="stairsDelivery">
<option value="0">Ground</option><option value="1">1</option><option value="2">2</option>
<option value="3">3</option><option value="4">4</option>
</select>

<textarea id="info" placeholder="Additional info"></textarea>

<button id="quoteBtn">Get Quote</button>

</form>

<div id="result" class="result"></div>

<button id="whatsappBtn">WhatsApp</button>
<button id="emailBtn">Email</button>

</div>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDex0iuSIdBsP21VWQJxws0dlpUj9heWac&libraries=places"></script>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>

emailjs.init("UTKviVTwg9BJjYixe");

/* VALIDARE DATA */
quoteForm.onsubmit=function(e){
e.preventDefault();
dateError.innerText="";
let d=new Date(moveDate.value);
if(!moveDate.value || d<=new Date()){
dateError.innerText="Future date required";
return;
}
calculate();
};

/* RATE PE VAN */
function getRate(van,men){
const pricing={
small:[45,65,85,105],
medium:[55,75,95,115],
large:[65,85,100,120],
luton:[75,95,110,130]
};
return pricing[van][men];
}

function calculate(){

let service=new google.maps.DistanceMatrixService();

let segs=via.value?
[{origin:collection.value,destination:via.value},{origin:via.value,destination:delivery.value}]
:[{origin:collection.value,destination:delivery.value}];

let m=0,s=0,d=0;

segs.forEach(seg=>{
service.getDistanceMatrix({
origins:[seg.origin],
destinations:[seg.destination],
travelMode:"DRIVING"
},res=>{
let el=res.rows[0].elements[0];
if(el.status!=="OK"){alert("Address error");return;}
m+=el.distance.value;
s+=el.duration.value;
d++;
if(d===segs.length) finish(m,s);
});
});

function finish(meters,seconds){

let miles=meters/1609.34;
let travelH=seconds/3600;

let men=parseInt(help.value);
let rate=getRate(van.value,men);

/* RUSH HOUR */
let h=new Date(moveDate.value).getHours();
if((h>=8&&h<=10)||(h>=16&&h<=18)) rate+=10;

/* STAIRS */
let stairsTotal=parseInt(stairsCollection.value)+parseInt(stairsVia.value)+parseInt(stairsDelivery.value);
let costStairs=stairsTotal*10*men;

/* TIME REAL */
let load=[40,30,20,15][men]/60;
let hours=Math.ceil((travelH+load+stairsTotal*0.166)*2)/2;
if(hours<2) hours=2;

let costHours=hours*rate;
let costMiles=miles*1.5;

/* CONGESTION */
let congestion=/(EC|WC|W1|SW1|SE1)/.test((collection.value+delivery.value).toUpperCase())?18:0;

let total=costHours+costMiles+costStairs+congestion;

let menText=men===0?"Driver only":men+" men";

let stairsText=men===0?
`${stairsTotal} flights (no help required)`:
`${stairsTotal} × £10 × ${menText}`;

let quote=`FAST ANY MOVES LTD

Time: ${hours}h
Distance: ${miles.toFixed(2)} miles

TOTAL: £${total.toFixed(2)}

Labour: £${costHours.toFixed(2)}
Distance: £${costMiles.toFixed(2)}
Stairs: £${costStairs.toFixed(2)}
Congestion: £${congestion}`;

result.innerText=quote;

fullMessage=`${name.value}
${phone.value}

${quote}`;

}

}

/* EMAIL */
emailBtn.onclick=()=>{
emailjs.send("service_1e9jyk9","template_0tbv6y9",{quote_breakdown:fullMessage,email:email.value});
};

/* WHATSAPP */
whatsappBtn.onclick=()=>{
window.open("https://wa.me/447846769519?text="+encodeURIComponent(fullMessage));
};

</script>

</body>
</html>
