<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fast Any Moves Ltd – Instant Moving Quote</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body{font-family:'Poppins',sans-serif;background:#f4f7fb;margin:0;}
.container{max-width:800px;margin:40px auto;background:white;padding:30px;border-radius:12px;box-shadow:0 8px 25px rgba(0,0,0,0.12);}
label{font-weight:600;display:block;margin-top:15px;}
input,select,textarea{width:100%;padding:12px;margin-top:5px;border-radius:6px;border:1px solid #ccc;}
button{width:100%;padding:15px;margin-top:10px;border:none;border-radius:6px;font-weight:600;cursor:pointer;}
#quoteBtn{background:#0B4DBA;color:white;}
#whatsappBtn{background:#25D366;color:white;}
#emailBtn{background:#007bff;color:white;}
.result{margin-top:25px;padding:20px;background:#eef5ff;border-radius:8px;white-space:pre-line;}
.error{color:red;font-size:13px;}
.error-input{border:2px solid red;}
</style>
</head>

<body>

<div class="container">

<h2>Fast Any Moves Ltd – Instant Quote</h2>

<form id="form">

<label>Name *</label>
<input id="name">
<div class="error" id="err_name"></div>

<label>Email *</label>
<input id="email">
<div class="error" id="err_email"></div>

<label>Phone *</label>
<input id="phone">
<div class="error" id="err_phone"></div>

<label>Date *</label>
<input type="datetime-local" id="date">
<div class="error" id="err_date"></div>

<label>Van *</label>
<select id="van">
<option value="">Select</option>
<option value="small">Small</option>
<option value="medium">Medium</option>
<option value="large">Large</option>
<option value="luton">Luton</option>
</select>
<div class="error" id="err_van"></div>

<label>Help *</label>
<select id="help">
<option value="">Select</option>
<option value="0">Driver only</option>
<option value="1">1 man</option>
<option value="2">2 men</option>
<option value="3">3 men</option>
</select>
<div class="error" id="err_help"></div>

<label>Collection *</label>
<input id="collection">
<div class="error" id="err_collection"></div>

<label>Delivery *</label>
<input id="delivery">
<div class="error" id="err_delivery"></div>

<button id="quoteBtn">Get Quote</button>

</form>

<div id="result" class="result"></div>

<button id="whatsappBtn">WhatsApp</button>
<button id="emailBtn">Email</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>

emailjs.init("UTKviVTwg9BJjYixe");

let ready=false;
let message="";

/* PRICING */
function getRate(van, men){
const pricing={
small:[35,40,60,90],
medium:[35,40,60,90],
large:[40,50,70,100],
luton:[40,50,70,100]
};
return pricing[van][men];
}

/* VALIDARE LIVE */
const fields=["name","email","phone","date","van","help","collection","delivery"];

fields.forEach(id=>{
document.getElementById(id).addEventListener("input",()=>validateField(id));
document.getElementById(id).addEventListener("change",()=>validateField(id));
});

function validateField(id){
let el=document.getElementById(id);
let err=document.getElementById("err_"+id);

err.innerText="";
el.classList.remove("error-input");

if(!el.value){
err.innerText="Required";
el.classList.add("error-input");
return false;
}

if(id==="date" && new Date(el.value)<=new Date()){
err.innerText="Future date required";
el.classList.add("error-input");
return false;
}

return true;
}

/* VALIDARE FINALĂ + SCROLL */
function validateAll(){

let firstError=null;

fields.forEach(id=>{
let valid=validateField(id);
if(!valid && !firstError){
firstError=document.getElementById(id);
}
});

if(firstError){
firstError.scrollIntoView({behavior:"smooth",block:"center"});
firstError.focus();
return false;
}

return true;
}

/* SUBMIT */
form.onsubmit=function(e){
e.preventDefault();

if(!validateAll()) return;

let men=parseInt(help.value);
let rate=getRate(van.value,men);

/* SIMPLU (nu ating calculul tău real aici) */
let miles=10;
let hours=2;

let costHours=hours*rate;
let costMiles=miles*1.5;
let total=costHours+costMiles;

let quote=`TOTAL: £${total.toFixed(2)}

Labour: £${costHours.toFixed(2)}
Distance: £${costMiles.toFixed(2)}`;

result.innerText=quote;

message=`Fast Any Moves Booking

Name: ${name.value}
Phone: ${phone.value}
Email: ${email.value}

${quote}`;

ready=true;
};

/* EMAIL */
emailBtn.onclick=function(){
if(!ready){alert("Calculate first");return;}

emailjs.send("service_1e9jyk9","template_0tbv6y9",{
quote_breakdown: message,
email: email.value
})
.then(()=>alert("Email sent successfully ✔"))
.catch(()=>alert("Email failed ❌"));
};

/* WHATSAPP */
whatsappBtn.onclick=function(){
if(!ready){alert("Calculate first");return;}
window.open("https://wa.me/447846769519?text="+encodeURIComponent(message));
};

</script>

</body>
</html>
