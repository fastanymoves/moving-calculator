<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fast Any Moves Ltd – Instant Moving Quote</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body{font-family:'Poppins',sans-serif;background:#f4f7fb;margin:0;}
.container{max-width:800px;margin:40px auto;background:white;padding:30px;border-radius:12px;box-shadow:0 8px 25px rgba(0,0,0,0.12);}
label{font-weight:600;display:block;margin-top:15px;}
input,select,textarea{width:100%;padding:12px;margin-top:5px;border-radius:6px;border:1px solid #ccc;}
button{width:100%;padding:15px;margin-top:8px;border:none;border-radius:6px;font-weight:600;cursor:pointer;}
#quoteBtn{background:#0B4DBA;color:white;}
#whatsappBtn{background:#25D366;color:white;}
#emailBtn{background:#007bff;color:white;}
.result{margin-top:25px;padding:20px;background:#eef5ff;border-radius:8px;white-space:pre-line;}

.error{color:red;font-size:13px;}
.error-input{border:2px solid red;}
</style>
</head>

<body>

<div class="container">

<h2>Fast Any Moves Ltd – Instant Quote</h2>

<form id="quoteForm">

<label>Name *</label>
<input id="name"><div class="error" id="err_name"></div>

<label>Email *</label>
<input id="email"><div class="error" id="err_email"></div>

<label>Phone *</label>
<input id="phone"><div class="error" id="err_phone"></div>

<label>Date *</label>
<input type="datetime-local" id="moveDate"><div class="error" id="err_moveDate"></div>

<label>Van *</label>
<select id="van">
<option value="">Select</option>
<option value="small">Small</option>
<option value="medium">Medium</option>
<option value="large">Large</option>
<option value="luton">Luton</option>
</select><div class="error" id="err_van"></div>

<label>Help *</label>
<select id="help">
<option value="">Select</option>
<option value="0">Driver only</option>
<option value="1">Driver help</option>
<option value="2">Driver + 1 helper</option>
<option value="3">Driver + 2 helpers</option>
</select><div class="error" id="err_help"></div>

<label>Collection *</label>
<input id="collection"><div class="error" id="err_collection"></div>

<label>Collection Stairs *</label>
<select id="stairsCollection">
<option value="0">Ground floor / Lift</option>
<option value="1">1 Flight</option>
<option value="2">2 Flights</option>
<option value="3">3 Flights</option>
<option value="4">4 Flights</option>
</select>

<label>Via</label>
<input id="via">

<label>Via Stairs</label>
<select id="stairsVia">
<option value="0">Ground floor / Lift</option>
<option value="1">1 Flight</option>
<option value="2">2 Flights</option>
<option value="3">3 Flights</option>
<option value="4">4 Flights</option>
</select>

<label>Delivery *</label>
<input id="delivery"><div class="error" id="err_delivery"></div>

<label>Delivery Stairs *</label>
<select id="stairsDelivery">
<option value="0">Ground floor / Lift</option>
<option value="1">1 Flight</option>
<option value="2">2 Flights</option>
<option value="3">3 Flights</option>
<option value="4">4 Flights</option>
</select>

<label>Additional Info</label>
<textarea id="info"></textarea>

<button type="submit">Get Quote</button>

</form>

<div id="result" class="result"></div>

<button id="whatsappBtn">WhatsApp</button>
<button id="emailBtn">Email</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>

emailjs.init("UTKviVTwg9BJjYixe");

let ready=false;
let fullMessage="";

/* PRICING */
function getRate(van, men){
const pricing={
small:[35,40,60,90],
medium:[35,40,60,90],
large:[40,50,70,100],
luton:[40,50,70,100]
};
return pricing[van][men];
}

/* VALIDARE */
const fields=["name","email","phone","moveDate","van","help","collection","delivery"];

function validateField(id){
let el=document.getElementById(id);
let err=document.getElementById("err_"+id);

err.innerText="";
el.classList.remove("error-input");

if(!el.value){
err.innerText="Required";
el.classList.add("error-input");
return false;
}

if(id==="moveDate" && new Date(el.value)<=new Date()){
err.innerText="Future date required";
el.classList.add("error-input");
return false;
}

return true;
}

function validateAll(){
let first=null;

fields.forEach(id=>{
if(!validateField(id) && !first){
first=document.getElementById(id);
}
});

if(first){
first.scrollIntoView({behavior:"smooth",block:"center"});
first.focus();
return false;
}

return true;
}

/* LIVE VALIDARE */
fields.forEach(id=>{
document.getElementById(id).addEventListener("input",()=>validateField(id));
});

/* SUBMIT */
quoteForm.onsubmit=function(e){
e.preventDefault();

if(!validateAll()) return;

let men=parseInt(help.value);
let rate=getRate(van.value,men);

let miles=10;
let hours=2;

let costHours=hours*rate;
let costMiles=miles*1.5;
let total=costHours+costMiles;

let quote=`TOTAL: £${total.toFixed(2)}

Labour: £${costHours.toFixed(2)}
Distance: £${costMiles.toFixed(2)}`;

result.innerText=quote;

fullMessage=`Name: ${name.value}
Phone: ${phone.value}
Email: ${email.value}

${quote}`;

ready=true;
};

/* EMAIL */
emailBtn.onclick=function(){
if(!ready)return alert("Calculate first");

emailjs.send("service_1e9jyk9","template_0tbv6y9",{
quote_breakdown: fullMessage,
email: email.value
})
.then(()=>alert("Email sent ✔"))
.catch(()=>alert("Email failed ❌"));
};

/* WHATSAPP */
whatsappBtn.onclick=function(){
if(!ready)return alert("Calculate first");
window.open("https://wa.me/447846769519?text="+encodeURIComponent(fullMessage));
};

</script>

</body>
</html>
