<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fast Any Moves Ltd – Instant Moving Quote</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body{font-family:'Poppins',sans-serif;background:#f4f7fb;margin:0;}
.container{max-width:800px;margin:40px auto;background:white;padding:30px;border-radius:12px;box-shadow:0 8px 25px rgba(0,0,0,0.12);}
h1{text-align:center;color:#0B4DBA;}
h2{text-align:center;font-weight:400;color:#555;margin-bottom:25px;}
label{font-weight:600;display:block;margin-top:15px;}

input,select,textarea{
width:100%;
padding:12px;
margin-top:5px;
border-radius:6px;
border:1px solid #ccc;
appearance:none;
-webkit-appearance:none;
}

button{width:100%;padding:15px;margin-top:8px;border:none;border-radius:6px;font-weight:600;cursor:pointer;}
#quoteBtn{background:#0B4DBA;color:white;}
#whatsappBtn{background:#25D366;color:white;}
#emailBtn{background:#007bff;color:white;}

.result{margin-top:25px;padding:20px;background:#eef5ff;border-radius:8px;white-space:pre-line;}

.error-text{
color:red;
font-size:13px;
margin-top:5px;
display:none;
}

/* 🔥 invalid style */
input.invalid, select.invalid{
border:2px solid red !important;
box-shadow:0 0 0 2px rgba(255,0,0,0.2);
}

.invalid::placeholder{
color:#ff4d4d;
}
</style>
</head>

<body>

<div class="container">

<h1>Fast Any Moves Ltd</h1>
<h2>Instant Moving Quote – London Man & Van</h2>

<form id="quoteForm">

<label>Name *</label>
<input type="text" id="name" required>

<label>Email *</label>
<input type="email" id="email" required>

<label>Phone *</label>
<input type="text" id="phone" required>

<label>Moving Date & Time *</label>
<input type="datetime-local" id="moveDate" required>
<div id="dateError" class="error-text">⚠️ Please select a future date and time</div>

<label>Van *</label>
<select id="van" required>
<option value="">Select</option>
<option value="small">Small Van</option>
<option value="medium">Medium Van</option>
<option value="large">Large Van</option>
<option value="luton">Luton Van</option>
</select>

<label>Help *</label>
<select id="help" required>
<option value="">Select</option>
<option value="0">No help required</option>
<option value="1">Driver help</option>
<option value="2">Driver + 1 helper</option>
<option value="3">Driver + 2 helpers</option>
</select>

<label>Collection Address *</label>
<input type="text" id="collection" required>

<label>Collection Stairs *</label>
<select id="stairsCollection">
<option value="0">Ground floor / Lift</option>
<option value="1">1 Flight</option>
<option value="2">2 Flights</option>
<option value="3">3 Flights</option>
<option value="4">4 Flights</option>
</select>

<label>Via Address</label>
<input type="text" id="via">

<label>Via Stairs</label>
<select id="stairsVia">
<option value="0">Ground floor / Lift</option>
<option value="1">1 Flight</option>
<option value="2">2 Flights</option>
<option value="3">3 Flights</option>
<option value="4">4 Flights</option>
</select>

<label>Delivery Address *</label>
<input type="text" id="delivery" required>

<label>Delivery Stairs *</label>
<select id="stairsDelivery">
<option value="0">Ground floor / Lift</option>
<option value="1">1 Flight</option>
<option value="2">2 Flights</option>
<option value="3">3 Flights</option>
<option value="4">4 Flights</option>
</select>

<label>Additional Information</label>
<textarea id="info"></textarea>

<button type="submit" id="quoteBtn">Get My Instant Quote</button>

</form>

<div id="result" class="result"></div>

<div id="bookingButtons" style="display:none;">
<button id="whatsappBtn">Book via WhatsApp</button>
<button id="emailBtn">Book via Email</button>
</div>

</div>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDex0iuSIdBsP21VWQJxws0dlpUj9heWac&libraries=places"></script>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>

window.onload=function(){
new google.maps.places.Autocomplete(collection);
new google.maps.places.Autocomplete(via);
new google.maps.places.Autocomplete(delivery);
};

emailjs.init("UTKviVTwg9BJjYixe");

function formatDateUK(value){
let d=new Date(value);
return d.toLocaleString("en-GB",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
}

let now=new Date();
now.setMinutes(now.getMinutes()-now.getTimezoneOffset());
moveDate.min=now.toISOString().slice(0,16);

function getRate(van,men){
return {
small:[35,40,60,90],
medium:[35,40,60,90],
large:[40,50,70,100],
luton:[40,50,70,100]
}[van][men];
}

/* 🔥 VALIDARE FINALĂ */
function validateAndScroll(){

let fields=["name","email","phone","moveDate","van","help","collection","delivery"];
let firstError=null;

dateError.style.display="none";

fields.forEach(id=>{
let el=document.getElementById(id);
el.classList.remove("invalid");

/* DATE */
if(id==="moveDate"){
if(!el.value){
el.classList.add("invalid");
dateError.style.display="block";
if(!firstError) firstError=el;
return;
}
let selected=new Date(el.value);
if(selected.getTime() <= Date.now()){
el.classList.add("invalid");
dateError.style.display="block";
if(!firstError) firstError=el;
return;
}
}

/* NORMAL */
if(!el.value){
el.classList.add("invalid");
if(!firstError) firstError=el;
}
});

/* 🔥 SCROLL FIX */
if(firstError){

let rect=firstError.getBoundingClientRect();
let offset=160;

window.scrollTo({
top: rect.top + window.pageYOffset - offset,
behavior:"smooth"
});

/* retry focus */
setTimeout(()=>{
firstError.focus();

let rect2=firstError.getBoundingClientRect();
if(rect2.top < 0 || rect2.top > window.innerHeight){
window.scrollTo({
top: rect2.top + window.pageYOffset - offset,
behavior:"smooth"
});
}
},500);

return false;
}

return true;
}

let fullMessage="";

quoteForm.addEventListener("submit",function(e){
e.preventDefault();

if(!validateAndScroll()) return;

let men=parseInt(help.value);
let rate=getRate(van.value,men);

let stairsTotal=+stairsCollection.value+ +stairsVia.value+ +stairsDelivery.value;
let costStairs=men===0?0:stairsTotal*10*men;

let service=new google.maps.DistanceMatrixService();
let viaValue=via.value;

if(viaValue){

service.getDistanceMatrix({origins:[collection.value],destinations:[viaValue],travelMode:"DRIVING"},function(r1){
let el1=r1.rows[0].elements[0];

service.getDistanceMatrix({origins:[viaValue],destinations:[delivery.value],travelMode:"DRIVING"},function(r2){
calculate(el1,r2.rows[0].elements[0]);
});
});

}else{

service.getDistanceMatrix({origins:[collection.value],destinations:[delivery.value],travelMode:"DRIVING"},function(r){
calculate(r.rows[0].elements[0],null);
});
}

function calculate(el1,el2){

let distance=el1.distance.value;
let duration=el1.duration.value;

if(el2){
distance+=el2.distance.value;
duration+=el2.duration.value;
}

let miles=distance/1609.34;
let totalTime=duration + [40,30,20,15][men]*60 + stairsTotal*600;

let hours=Math.ceil((totalTime/3600)*2)/2;
if(hours<2)hours=2;

let total=hours*rate + miles*1.5 + costStairs +
(/(EC|WC|W1|SW1|SE1)/.test((collection.value+via.value+delivery.value).toUpperCase())?18:0);

let quote=`TOTAL PRICE: £${total.toFixed(2)}\nTime: ${hours}h\nDistance: ${miles.toFixed(2)} miles`;

fullMessage=quote;

result.innerText=quote;
bookingButtons.style.display="block";
}

});

emailBtn.onclick=()=>emailjs.send("service_1e9jyk9","template_0tbv6y9",{quote_breakdown:fullMessage,email:email.value}).then(()=>alert("Email sent ✔"));

whatsappBtn.onclick=()=>window.open("https://wa.me/447846769519?text="+encodeURIComponent(fullMessage));

</script>

</body>
</html>
