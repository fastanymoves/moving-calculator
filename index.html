<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fast Any Moves Ltd – Instant Moving Quote</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body{font-family:'Poppins',sans-serif;background:#f4f7fb;margin:0;}
.container{max-width:800px;margin:40px auto;background:white;padding:30px;border-radius:12px;box-shadow:0 8px 25px rgba(0,0,0,0.12);}
h1{text-align:center;color:#0B4DBA;}
h2{text-align:center;color:#555;}
label{font-weight:600;display:block;margin-top:15px;}
input,select,textarea{width:100%;padding:12px;margin-top:5px;border-radius:6px;border:1px solid #ccc;}
button{width:100%;padding:15px;margin-top:10px;border:none;border-radius:6px;font-weight:600;cursor:pointer;}
#quoteBtn{background:#0B4DBA;color:white;}
#whatsappBtn{background:#25D366;color:white;}
#emailBtn{background:#007bff;color:white;}
.result{margin-top:20px;padding:20px;background:#eef5ff;border-radius:8px;white-space:pre-line;}
</style>
</head>

<body>

<div class="container">

<h1>Fast Any Moves Ltd</h1>
<h2>Instant Moving Quote</h2>

<form id="quoteForm">

<input id="name" placeholder="Name" required>
<input id="email" placeholder="Email" required>
<input id="phone" placeholder="Phone" required>
<input type="datetime-local" id="moveDate" required>

<select id="van" required>
<option value="">Van</option>
<option value="small">Small</option>
<option value="medium">Medium</option>
<option value="large">Large</option>
<option value="luton">Luton</option>
</select>

<select id="help" required>
<option value="">Help</option>
<option value="0">Driver only</option>
<option value="1">Driver help</option>
<option value="2">Driver +1</option>
<option value="3">Driver +2</option>
</select>

<input id="collection" placeholder="Collection" required>
<input id="via" placeholder="Via (optional)">
<input id="delivery" placeholder="Delivery" required>

<button id="quoteBtn">Get Quote</button>

</form>

<div id="result" class="result"></div>

<div id="bookingButtons" style="display:none;">
<button id="whatsappBtn">WhatsApp</button>
<button id="emailBtn">Email</button>
</div>

</div>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDex0iuSIdBsP21VWQJxws0dlpUj9heWac&libraries=places"></script>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>

emailjs.init("UTKviVTwg9BJjYixe");

/* AUTOCOMPLETE FIX */
window.addEventListener("load",()=>{
const opt={componentRestrictions:{country:"uk"}};
new google.maps.places.Autocomplete(document.getElementById("collection"),opt);
new google.maps.places.Autocomplete(document.getElementById("via"),opt);
new google.maps.places.Autocomplete(document.getElementById("delivery"),opt);
});

/* DATE BLOCK */
let now=new Date();
now.setMinutes(now.getMinutes()-now.getTimezoneOffset());
moveDate.min=now.toISOString().slice(0,16);

/* RATE */
function getRate(van,men){
const p={
small:[35,40,60,90],
medium:[35,40,60,90],
large:[40,50,70,100],
luton:[40,50,70,100]
};
return p[van][men];
}

let fullMessage="";
let ready=false;

/* VALIDARE */
quoteForm.onsubmit=(e)=>{
e.preventDefault();

let f=[name,email,phone,moveDate,van,help,collection,delivery];
let first=null;

f.forEach(el=>{
el.style.border="1px solid #ccc";
if(!el.value || (el.id==="moveDate" && new Date(el.value)<=new Date())){
el.style.border="2px solid red";
if(!first) first=el;
}
});

if(first){
first.scrollIntoView({behavior:"smooth"});
return;
}

calculate();
};

/* CALCUL REAL */
function calculate(){

let men=parseInt(help.value);
let rate=getRate(van.value,men);

let segments = via.value ?
[
{origin:collection.value,destination:via.value},
{origin:via.value,destination:delivery.value}
]
:
[
{origin:collection.value,destination:delivery.value}
];

let meters=0,seconds=0,done=0;

segments.forEach(s=>{
new google.maps.DistanceMatrixService().getDistanceMatrix({
origins:[s.origin],
destinations:[s.destination],
travelMode:"DRIVING"
},function(r){

let el=r.rows[0].elements[0];
if(el.status!=="OK"){alert("Invalid address");return;}

meters+=el.distance.value;
seconds+=el.duration.value;
done++;

if(done===segments.length) finish();

});
});

function finish(){

let miles=meters/1609.34;
let hours=Math.ceil((seconds/3600)*2)/2;
if(hours<2)hours=2;

let costHours=hours*rate;
let costMiles=miles*1.5;

let congestion=/(EC|WC|W1|SW1|SE1)/.test((collection.value+via.value+delivery.value).toUpperCase())?18:0;

let total=costHours+costMiles+congestion;

let quote=`TOTAL £${total.toFixed(2)}

Labour: £${costHours.toFixed(2)}
Distance: £${costMiles.toFixed(2)}
Congestion: £${congestion.toFixed(2)}

Time: ${hours}h
Miles: ${miles.toFixed(2)}`;

result.innerText=quote;
bookingButtons.style.display="block";

fullMessage=`Fast Any Moves Booking

Name: ${name.value}
Phone: ${phone.value}
Email: ${email.value}

${quote}`;

ready=true;

}

}

/* EMAIL */
emailBtn.onclick=()=>{
if(!ready)return alert("Calculate first");

emailjs.send("service_1e9jyk9","template_0tbv6y9",{
quote_breakdown: fullMessage,
email: email.value
}).then(()=>alert("Email sent ✔"));
};

/* WHATSAPP */
whatsappBtn.onclick=()=>{
if(!ready)return alert("Calculate first");
window.open("https://wa.me/447846769519?text="+encodeURIComponent(fullMessage));
};

</script>

</body>
</html>
