<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fast Any Moves Ltd – Instant Moving Quote</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body{font-family:'Poppins',sans-serif;background:#f4f7fb;margin:0;}
.container{max-width:800px;margin:40px auto;background:white;padding:30px;border-radius:12px;box-shadow:0 8px 25px rgba(0,0,0,0.12);}
label{font-weight:600;display:block;margin-top:15px;}
input,select,textarea{width:100%;padding:12px;margin-top:5px;border-radius:6px;border:1px solid #ccc;}
button{width:100%;padding:15px;margin-top:10px;border:none;border-radius:6px;cursor:pointer;font-weight:600;}
#quoteBtn{background:#0B4DBA;color:white;}
#whatsappBtn{background:#25D366;color:white;}
#emailBtn{background:#007bff;color:white;}
.result{margin-top:20px;background:#eef5ff;padding:15px;border-radius:8px;white-space:pre-line;}
</style>
</head>

<body>

<div class="container">

<h2>Fast Any Moves Ltd – Instant Quote</h2>

<form id="form">

<input id="name" placeholder="Name" required>
<input id="email" placeholder="Email" required>
<input id="phone" placeholder="Phone" required>
<input type="datetime-local" id="date" required>

<select id="van" required>
<option value="">Van</option>
<option value="small">Small</option>
<option value="medium">Medium</option>
<option value="large">Large</option>
<option value="luton">Luton</option>
</select>

<select id="help" required>
<option value="">Help</option>
<option value="0">Driver only</option>
<option value="1">1 man</option>
<option value="2">2 men</option>
<option value="3">3 men</option>
</select>

<input id="collection" placeholder="Collection" required>
<input id="via" placeholder="Via">
<input id="delivery" placeholder="Delivery" required>

<select id="stairsCollection">
<option value="0">Ground</option><option value="1">1</option><option value="2">2</option><option value="3">3</option>
</select>

<select id="stairsVia">
<option value="0">Ground</option><option value="1">1</option><option value="2">2</option><option value="3">3</option>
</select>

<select id="stairsDelivery">
<option value="0">Ground</option><option value="1">1</option><option value="2">2</option><option value="3">3</option>
</select>

<textarea id="info" placeholder="Additional info"></textarea>

<button id="quoteBtn">Get Quote</button>

</form>

<div id="result" class="result"></div>

<button id="whatsappBtn">WhatsApp</button>
<button id="emailBtn">Email</button>

</div>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDex0iuSIdBsP21VWQJxws0dlpUj9heWac"></script>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>

emailjs.init("UTKviVTwg9BJjYixe");

let FINAL_MESSAGE="";
let READY=false;

/* RATE */
function getRate(van,men){
const table={
small:[45,65,85,105],
medium:[55,75,95,115],
large:[65,85,100,120],
luton:[75,95,110,130]
};
return table[van][men];
}

/* SUBMIT */
form.onsubmit=function(e){
e.preventDefault();

/* SAFE INPUT */
const nameValue = name.value || "";
const emailValue = email.value || "";
const phoneValue = phone.value || "";
const vanValue = van.value;
const helpValue = parseInt(help.value);
const dateValue = date.value;
const collectionValue = collection.value;
const viaValue = via.value;
const deliveryValue = delivery.value;
const infoValue = info.value || "";

/* DATE LOCK */
if(!dateValue || new Date(dateValue) <= new Date()){
alert("Select future date");
return;
}

let service=new google.maps.DistanceMatrixService();

let segments=viaValue?
[{origin:collectionValue,destination:viaValue},{origin:viaValue,destination:deliveryValue}]
:[{origin:collectionValue,destination:deliveryValue}];

let meters=0,seconds=0,count=0;

segments.forEach(seg=>{
service.getDistanceMatrix({
origins:[seg.origin],
destinations:[seg.destination],
travelMode:"DRIVING"
},res=>{
let el=res.rows[0].elements[0];
if(el.status!=="OK"){alert("Invalid address");return;}

meters+=el.distance.value;
seconds+=el.duration.value;
count++;

if(count===segments.length) finish(meters,seconds);
});
});

function finish(m,s){

let miles=m/1609.34;
let travelH=s/3600;

let rate=getRate(vanValue,helpValue);

/* TIME */
let load=[40,30,20,15][helpValue]/60;
let stairsTotal=parseInt(stairsCollection.value)+parseInt(stairsVia.value)+parseInt(stairsDelivery.value);

let hours=Math.ceil((travelH+load+stairsTotal*0.166)*2)/2;
if(hours<2) hours=2;

/* COST */
let costHours=hours*rate;
let costMiles=miles*1.5;
let costStairs=stairsTotal*10*helpValue;

/* CONGESTION */
let congestion=/(EC|WC|W1|SW1|SE1)/.test((collectionValue+viaValue+deliveryValue).toUpperCase())?18:0;

let total=costHours+costMiles+costStairs+congestion;

/* TEXT */
let menText=helpValue===0?"Driver only":helpValue+" men";

let stairsText=helpValue===0
? `${stairsTotal} flights (no help required)`
: `${helpValue} men × ${stairsTotal} flights × £10`;

let quote=`FAST ANY MOVES LTD

Estimated working time: ${hours} hours
Distance: ${miles.toFixed(2)} miles

--------------------------------

TOTAL PRICE: £${total.toFixed(2)}

--------------------------------

Labour: £${costHours.toFixed(2)}
Distance: £${costMiles.toFixed(2)}
Stairs: £${costStairs.toFixed(2)}
Congestion: £${congestion.toFixed(2)}

--------------------------------

This quotation is based on the details provided by the customer.

Any additional time required will be charged in 30-minute increments.`;

/* FINAL MESSAGE LOCK */
FINAL_MESSAGE=`Fast Any Moves Booking

Name: ${nameValue}
Phone: ${phoneValue}
Email: ${emailValue}

Move Date: ${new Date(dateValue).toLocaleString('en-GB')}

Van: ${vanValue}
Help: ${menText}

Collection: ${collectionValue}
Via: ${viaValue}
Delivery: ${deliveryValue}

${quote}`;

result.innerText=quote;
READY=true;
}

};

/* EMAIL */
emailBtn.onclick=()=>{
if(!READY)return alert("Calculate first");
emailjs.send("service_1e9jyk9","template_0tbv6y9",{
quote_breakdown: FINAL_MESSAGE,
email: email.value
});
};

/* WHATSAPP */
whatsappBtn.onclick=()=>{
if(!READY)return alert("Calculate first");
window.open("https://wa.me/447846769519?text="+encodeURIComponent(FINAL_MESSAGE));
};

</script>

</body>
</html>
