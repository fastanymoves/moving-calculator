<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fast Any Moves Ltd – Instant Moving Quote</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body{font-family:'Poppins',sans-serif;background:#f4f7fb;margin:0;}
.container{max-width:800px;margin:40px auto;background:white;padding:30px;border-radius:12px;box-shadow:0 8px 25px rgba(0,0,0,0.12);}
h1{text-align:center;color:#0B4DBA;}
h2{text-align:center;font-weight:400;color:#555;margin-bottom:25px;}
label{font-weight:600;display:block;margin-top:15px;}
input,select,textarea{width:100%;padding:12px;margin-top:5px;border-radius:6px;border:1px solid #ccc;}
button{width:100%;padding:15px;margin-top:8px;border:none;border-radius:6px;font-weight:600;cursor:pointer;}
#quoteBtn{background:#0B4DBA;color:white;}
#whatsappBtn{background:#25D366;color:white;}
#emailBtn{background:#007bff;color:white;}
.result{margin-top:25px;padding:20px;background:#eef5ff;border-radius:8px;white-space:pre-line;}
.error{color:red;font-size:13px;margin-top:5px;}
</style>
</head>

<body>

<div class="container">

<h1>Fast Any Moves Ltd</h1>
<h2>Instant Moving Quote – London Man & Van</h2>

<form id="quoteForm">

<label>Name *</label>
<input type="text" id="name" required>

<label>Email *</label>
<input type="email" id="email" required>

<label>Phone *</label>
<input type="text" id="phone" required>

<label>Moving Date & Time *</label>
<input type="datetime-local" id="moveDate" required>
<div id="dateError" class="error"></div>

<label>Van *</label>
<select id="van" required>
<option value="">Select</option>
<option value="small">Small Van</option>
<option value="medium">Medium Van</option>
<option value="large">Large Van</option>
<option value="luton">Luton Van</option>
</select>

<label>Help *</label>
<select id="help" required>
<option value="">Select</option>
<option value="0">No help required</option>
<option value="1">Driver help</option>
<option value="2">Driver + 1 helper</option>
<option value="3">Driver + 2 helpers</option>
</select>

<label>Collection Address *</label>
<input type="text" id="collection" required>

<label>Collection Stairs *</label>
<select id="stairsCollection" required>
<option value="0">Ground floor / Lift</option>
<option value="1">1 Flight</option>
<option value="2">2 Flights</option>
<option value="3">3 Flights</option>
<option value="4">4 Flights</option>
</select>

<label>Via Address</label>
<input type="text" id="via">

<label>Via Stairs</label>
<select id="stairsVia">
<option value="0">Ground floor / Lift</option>
<option value="1">1 Flight</option>
<option value="2">2 Flights</option>
<option value="3">3 Flights</option>
<option value="4">4 Flights</option>
</select>

<label>Delivery Address *</label>
<input type="text" id="delivery" required>

<label>Delivery Stairs *</label>
<select id="stairsDelivery" required>
<option value="0">Ground floor / Lift</option>
<option value="1">1 Flight</option>
<option value="2">2 Flights</option>
<option value="3">3 Flights</option>
<option value="4">4 Flights</option>
</select>

<label>Additional Information</label>
<textarea id="info"></textarea>

<button type="submit" id="quoteBtn">Get My Instant Quote</button>

</form>

<div id="result" class="result"></div>

<div id="bookingButtons" style="display:none;margin-top:10px;">
<button id="whatsappBtn">Book via WhatsApp</button>
<button id="emailBtn">Book via Email</button>
</div>

</div>

<script>
function initAutocomplete(){
new google.maps.places.Autocomplete(document.getElementById('collection'));
new google.maps.places.Autocomplete(document.getElementById('via'));
new google.maps.places.Autocomplete(document.getElementById('delivery'));
}
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDex0iuSIdBsP21VWQJxws0dlpUj9heWac&libraries=places&callback=initAutocomplete" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>

emailjs.init("UTKviVTwg9BJjYixe");

let fullMessage="";
let ready=false;

/* VALIDARE DATA */
quoteForm.addEventListener("submit",function(e){
e.preventDefault();

dateError.innerText="";
let selected=new Date(moveDate.value);
if(!moveDate.value || selected<=new Date()){
dateError.innerText="Please select a future date";
return;
}

calculate();
});

function calculate(){

/* SAFE VALUES */
const nameValue = document.getElementById("name").value;
const phoneValue = document.getElementById("phone").value;
const emailValue = document.getElementById("email").value;
const vanValue = document.getElementById("van").value;
const infoValue = document.getElementById("info").value;

const collectionValue = document.getElementById("collection").value;
const viaValue = document.getElementById("via").value;
const deliveryValue = document.getElementById("delivery").value;

let men=parseInt(document.getElementById("help").value);
let rate=[45,50,100,120][men];

let stairsCollectionText=stairsCollection.options[stairsCollection.selectedIndex].text;
let stairsViaText=stairsVia.options[stairsVia.selectedIndex].text;
let stairsDeliveryText=stairsDelivery.options[stairsDelivery.selectedIndex].text;

let stairsTotal=parseInt(stairsCollection.value)+parseInt(stairsVia.value)+parseInt(stairsDelivery.value);
let costStairs=stairsTotal*10*men;

let service=new google.maps.DistanceMatrixService();

let segments=viaValue?
[{origin:collectionValue,destination:viaValue},{origin:viaValue,destination:deliveryValue}]
:[{origin:collectionValue,destination:deliveryValue}];

let meters=0,seconds=0,count=0;

segments.forEach(seg=>{
service.getDistanceMatrix({
origins:[seg.origin],
destinations:[seg.destination],
travelMode:"DRIVING"
},res=>{
let el=res.rows[0].elements[0];

if(el.status!=="OK"){alert("Invalid address");return;}

meters+=el.distance.value;
seconds+=el.duration.value;
count++;

if(count===segments.length) finish(meters,seconds);
});
});

function finish(m,s){

let miles=m/1609.34;
let travelH=s/3600;

let load=[40,30,20,15][men]/60;
let hours=Math.ceil((travelH+load+stairsTotal*0.166)*2)/2;
if(hours<2)hours=2;

let costHours=hours*rate;
let costMiles=miles*1.5;

let congestion=/(EC|WC|W1|SW1|SE1)/.test((collectionValue+viaValue+deliveryValue).toUpperCase())?18:0;

let total=costHours+costMiles+costStairs+congestion;

let menText=men===0?"Driver only":men===1?"1 man":men+" men";

let stairsText=men===0
? `${stairsTotal} flights (no help required)`
: `${menText} × ${stairsTotal} flights × £10`;

let quote=`FAST ANY MOVES LTD

Estimated working time: ${hours} hours
Distance: ${miles.toFixed(2)} miles

--------------------------------

TOTAL PRICE: £${total.toFixed(2)}

--------------------------------

COST BREAKDOWN

Labour
${hours} hours × £${rate}/hour
= £${costHours.toFixed(2)}

Distance
${miles.toFixed(2)} miles × £1.50/mile
= £${costMiles.toFixed(2)}

Stairs
${stairsText}
= £${costStairs.toFixed(2)}

Congestion charge
= £${congestion.toFixed(2)}

--------------------------------

This quotation is based on the details provided by the customer.

Any additional time required will be charged in 30-minute increments.`;

result.innerText=quote;
bookingButtons.style.display="block";

fullMessage=`Fast Any Moves Booking

Name: ${nameValue}
Phone: ${phoneValue}
Email: ${emailValue}

Move Date: ${new Date(moveDate.value).toLocaleString('en-GB')}

Van: ${vanValue}
Help: ${menText}

Collection: ${collectionValue}
Collection Stairs: ${stairsCollectionText}

Via: ${viaValue}
Via Stairs: ${stairsViaText}

Delivery: ${deliveryValue}
Delivery Stairs: ${stairsDeliveryText}

Additional Info:
${infoValue}

${quote}`;

ready=true;
}
}

/* EMAIL */
emailBtn.onclick=function(){
if(!ready)return alert("Calculate quote first");
emailjs.send("service_1e9jyk9","template_0tbv6y9",{
quote_breakdown: fullMessage,
email: document.getElementById("email").value
});
};

/* WHATSAPP */
whatsappBtn.onclick=function(){
if(!ready)return alert("Calculate quote first");
window.open("https://wa.me/447846769519?text="+encodeURIComponent(fullMessage));
};

</script>

</body>
</html>
