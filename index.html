<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fast Any Moves Ltd – Instant Moving Quote</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body{font-family:'Poppins',sans-serif;background:#f4f7fb;margin:0;}
.container{max-width:800px;margin:40px auto;background:white;padding:30px;border-radius:12px;box-shadow:0 8px 25px rgba(0,0,0,0.12);}
h1{text-align:center;color:#0B4DBA;}
h2{text-align:center;font-weight:400;color:#555;margin-bottom:25px;}
label{font-weight:600;display:block;margin-top:15px;}
input,select,textarea{width:100%;padding:12px;margin-top:5px;border-radius:6px;border:1px solid #ccc;}
button{width:100%;padding:15px;margin-top:8px;border:none;border-radius:6px;font-weight:600;cursor:pointer;}
#quoteBtn{background:#0B4DBA;color:white;}
#whatsappBtn{background:#25D366;color:white;}
#emailBtn{background:#007bff;color:white;}
.result{margin-top:25px;padding:20px;background:#eef5ff;border-radius:8px;white-space:pre-line;}
</style>
</head>

<body>

<div class="container">

<h1>Fast Any Moves Ltd</h1>
<h2>Instant Moving Quote – London Man & Van</h2>

<form id="quoteForm">

<label>Name *</label>
<input type="text" id="name" required>

<label>Email *</label>
<input type="email" id="email" required>

<label>Phone *</label>
<input type="text" id="phone" required>

<label>Moving Date & Time *</label>
<input type="datetime-local" id="moveDate" required>

<label>What size of van do you need for? *</label>
<select id="van" required>
<option value="">Select</option>
<option value="small">Small Van</option>
<option value="medium">Medium Van</option>
<option value="large">Large Van</option>
<option value="luton">Luton Van</option>
</select>

<label>Do you need help with loading and unloading? *</label>
<select id="help" required>
<option value="">Select</option>
<option value="0">No help required</option>
<option value="1">Driver help</option>
<option value="2">Driver + 1 helper</option>
<option value="3">Driver + 2 helpers</option>
</select>

<label>Collection Address *</label>
<input type="text" id="collection" required>

<label>Via Address (optional)</label>
<input type="text" id="via">

<label>Delivery Address *</label>
<input type="text" id="delivery" required>

<label>Additional Information</label>
<textarea id="info"></textarea>

<button type="submit" id="quoteBtn">Get My Instant Quote</button>

</form>

<div id="result" class="result"></div>

<div id="bookingButtons" style="display:none;margin-top:10px;">
<button id="whatsappBtn">Book via WhatsApp</button>
<button id="emailBtn">Book via Email</button>
</div>

</div>

<script>
function initAutocomplete(){
new google.maps.places.Autocomplete(document.getElementById('collection'));
new google.maps.places.Autocomplete(document.getElementById('via'));
new google.maps.places.Autocomplete(document.getElementById('delivery'));
}
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDex0iuSIdBsP21VWQJxws0dlpUj9heWac&libraries=places&callback=initAutocomplete" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>

emailjs.init("UTKviVTwg9BJjYixe");

document.getElementById("moveDate").min=new Date().toISOString().slice(0,16);

let quoteCalculated=false;
let fullMessage="";

function formatDate(dateValue){
let d=new Date(dateValue);
let day=String(d.getDate()).padStart(2,'0');
let month=String(d.getMonth()+1).padStart(2,'0');
let year=d.getFullYear();
let hours=String(d.getHours()).padStart(2,'0');
let minutes=String(d.getMinutes()).padStart(2,'0');
return `${day}/${month}/${year} - ${hours}:${minutes}`;
}

document.getElementById("quoteForm").addEventListener("submit",function(e){

if(!this.checkValidity()){
this.reportValidity();
return;
}

e.preventDefault();
calculateQuote();

});

function calculateQuote(){

let men=parseInt(document.getElementById("help").value);
let rate=[45,50,100,120][men];

const collection=document.getElementById("collection").value;
const via=document.getElementById("via").value;
const delivery=document.getElementById("delivery").value;

let formattedDate=formatDate(document.getElementById("moveDate").value);

let quote="Quote generated successfully";

document.getElementById("result").innerText=quote;
document.getElementById("bookingButtons").style.display="block";

fullMessage=`Fast Any Moves Booking

Name: ${document.getElementById("name").value}
Phone: ${document.getElementById("phone").value}
Email: ${document.getElementById("email").value}

Move Date: ${formattedDate}

Van: ${document.getElementById("van").value}
Help: ${document.getElementById("help").value}

Collection: ${collection}
Via: ${via}
Delivery: ${delivery}

Additional Info:
${document.getElementById("info").value}

${quote}`;

quoteCalculated=true;

}

document.getElementById("emailBtn").onclick=function(){
if(!quoteCalculated){alert("Calculate quote first");return;}
emailjs.send("service_1e9jyk9","template_0tbv6y9",{quote_breakdown:fullMessage})
.then(()=>alert("Email sent successfully"));
}

document.getElementById("whatsappBtn").onclick=function(){
if(!quoteCalculated){alert("Calculate quote first");return;}
window.open("https://wa.me/447846769519?text="+encodeURIComponent(fullMessage));
}

</script>

</body>
</html>
